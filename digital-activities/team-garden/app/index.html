<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Team Garden | حديقة الفريق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* =============== Tokens: light =============== */
:root{
  color-scheme:light;
  --ink:#12302A; --ink2:#3A574F; --line:#BCD5C8;
  --glass:rgba(255,255,255,.78); --glass-s:#FFFFFF; --paper:#FFFBF0; --kraft:#E3CB98; --paper-ink:#12302A;
  --leaf:#1E7A4C; --leaf-d:#12583A; --leaf-l:#D2EBDC; --on-leaf:#FFFFFF; --edge:#12583A;
  --sun:#F5B73C; --sun-l:#FFF1CC; --berry:#A8304F; --berry-l:#FBE3E9; --focus:#1B5FD6;
  --skyM:linear-gradient(180deg,#FFD3B0 0%,#BFE1F5 52%,#E6F5EA 100%);
  --skyN:linear-gradient(180deg,#6EBDF0 0%,#BDE6F8 58%,#E9F8EE 100%);
  --skyG:linear-gradient(180deg,#F6A47A 0%,#FBCF8C 42%,#FDEBC4 72%,#E6F4E2 100%);
  --h1:#A6DAB0; --h2:#7CC48E; --h3:#5BAA72; --wood1:#D2A56B; --wood2:#A97A47; --wood3:#8E6335;
  --orb:#FFD76A; --orb-glow:rgba(255,215,106,.6); --night:0; --day:1;
  --tag-bg:#FFFFFF; --tag-ink:#12302A;
  --stem:#2E9A5C; --leafA:#3FAE6B; --leafB:#74CC8F; --trunk:#8A5E3B; --lav:#8D6AD0; --tulip:#E85D8A; --pet:#F6C343; --ctr:#7A4A21;
  --t1:#F5DDB8; --t2:#CFE3FA; --t3:#C9EEE1; --t4:#FFE7A3;
  --shadow:0 18px 40px -20px rgba(18,88,58,.55);
  --hl:'Baloo Bhaijaan 2','Readex Pro',system-ui,'Segoe UI',Tahoma,sans-serif;
  --bd:'Readex Pro',system-ui,'Segoe UI',Tahoma,Arial,sans-serif;
}
/* =============== Tokens: dark (system) =============== */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ink:#E9F4EF; --ink2:#AEC8BF; --line:#2F5249;
    --glass:rgba(14,34,31,.8); --glass-s:#16302B; --paper:#FFF6DE; --kraft:#CDB07A; --paper-ink:#12302A;
    --leaf:#62D08F; --leaf-d:#3FA96B; --leaf-l:#1D4236; --on-leaf:#06231A; --edge:#2F8654;
    --sun:#F7C75B; --sun-l:#41371A; --berry:#FF9AB0; --berry-l:#4A212D; --focus:#8CC8FF;
    --skyM:linear-gradient(180deg,#0A1A38 0%,#173B5E 55%,#1F5A52 100%);
    --skyN:linear-gradient(180deg,#06172E 0%,#0D3849 58%,#14504A 100%);
    --skyG:linear-gradient(180deg,#2B1B4B 0%,#5C316F 40%,#8C4B69 70%,#1E4B45 100%);
    --h1:#1E5A47; --h2:#17493A; --h3:#103A2E; --wood1:#74513A; --wood2:#5C3F28; --wood3:#47301D;
    --orb:#F4F1D0; --orb-glow:rgba(244,241,208,.35); --night:1; --day:0;
    --tag-bg:#E9F4EF; --tag-ink:#12302A;
    --stem:#4DBB7A; --leafA:#55C985; --leafB:#8EE0A8; --trunk:#B58A62; --lav:#B79CF2; --tulip:#FF7FA6; --pet:#F7C75B; --ctr:#8A5A2B;
    --t1:#5C4A2E; --t2:#2C4666; --t3:#245046; --t4:#5E4F1E;
    --shadow:0 18px 40px -20px rgba(0,0,0,.85);
  }
}
/* =============== Tokens: dark (manual) =============== */
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#E9F4EF; --ink2:#AEC8BF; --line:#2F5249;
  --glass:rgba(14,34,31,.8); --glass-s:#16302B; --paper:#FFF6DE; --kraft:#CDB07A; --paper-ink:#12302A;
  --leaf:#62D08F; --leaf-d:#3FA96B; --leaf-l:#1D4236; --on-leaf:#06231A; --edge:#2F8654;
  --sun:#F7C75B; --sun-l:#41371A; --berry:#FF9AB0; --berry-l:#4A212D; --focus:#8CC8FF;
  --skyM:linear-gradient(180deg,#0A1A38 0%,#173B5E 55%,#1F5A52 100%);
  --skyN:linear-gradient(180deg,#06172E 0%,#0D3849 58%,#14504A 100%);
  --skyG:linear-gradient(180deg,#2B1B4B 0%,#5C316F 40%,#8C4B69 70%,#1E4B45 100%);
  --h1:#1E5A47; --h2:#17493A; --h3:#103A2E; --wood1:#74513A; --wood2:#5C3F28; --wood3:#47301D;
  --orb:#F4F1D0; --orb-glow:rgba(244,241,208,.35); --night:1; --day:0;
  --tag-bg:#E9F4EF; --tag-ink:#12302A;
  --stem:#4DBB7A; --leafA:#55C985; --leafB:#8EE0A8; --trunk:#B58A62; --lav:#B79CF2; --tulip:#FF7FA6; --pet:#F7C75B; --ctr:#8A5A2B;
  --t1:#5C4A2E; --t2:#2C4666; --t3:#245046; --t4:#5E4F1E;
  --shadow:0 18px 40px -20px rgba(0,0,0,.85);
}

/* =============== Base =============== */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#0B1B17}
html{-webkit-text-size-adjust:100%}
html[lang="ar"]{font-size:106%}
body{font-family:var(--bd);font-size:1rem;line-height:1.55;color:var(--ink)}
[dir="rtl"] body{line-height:1.8}
h1,h2,h3{font-family:var(--hl);line-height:1.2;margin:0;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}
[dir="rtl"] .flip{transform:scaleX(-1)}

/* =============== World (full-screen scene) =============== */
.world{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;isolation:isolate}
.sky{position:absolute;inset:0;opacity:0;transition:opacity 2.2s ease;z-index:0}
.sky.m{background:var(--skyM)}.sky.n{background:var(--skyN)}.sky.g{background:var(--skyG)}
.world[data-time="morning"] .sky.m,.world[data-time="noon"] .sky.n,.world[data-time="golden"] .sky.g{opacity:1}
.orb{position:absolute;width:clamp(46px,7vw,84px);aspect-ratio:1;border-radius:50%;background:var(--orb);box-shadow:0 0 0 12px var(--orb-glow),0 0 90px 30px var(--orb-glow);z-index:0;transition:left 2.4s ease,top 2.4s ease}
.world[data-time="morning"] .orb{left:12%;top:30%}
.world[data-time="noon"] .orb{left:52%;top:9%}
.world[data-time="golden"] .orb{left:84%;top:26%}
.stars{position:absolute;inset:0 0 40% 0;opacity:var(--night);z-index:0;pointer-events:none;
  background-image:radial-gradient(1.6px 1.6px at 8% 14%,#fff 50%,transparent 52%),radial-gradient(1.6px 1.6px at 18% 42%,#fff 50%,transparent 52%),radial-gradient(2px 2px at 31% 18%,#fff 50%,transparent 52%),radial-gradient(1.6px 1.6px at 43% 36%,#fff 50%,transparent 52%),radial-gradient(1.6px 1.6px at 57% 12%,#fff 50%,transparent 52%),radial-gradient(2px 2px at 66% 30%,#fff 50%,transparent 52%),radial-gradient(1.6px 1.6px at 76% 16%,#fff 50%,transparent 52%),radial-gradient(1.6px 1.6px at 91% 38%,#fff 50%,transparent 52%),radial-gradient(1.6px 1.6px at 24% 28%,#fff 50%,transparent 52%),radial-gradient(2px 2px at 84% 8%,#fff 50%,transparent 52%)}
.clouds{position:absolute;inset:0 0 45% 0;opacity:var(--day);z-index:0;pointer-events:none}
.clouds i{position:absolute;height:22px;border-radius:22px;background:#fff;opacity:.85;animation:drift 90s linear infinite}
.clouds i::after{content:"";position:absolute;left:20%;top:-14px;width:44%;height:28px;border-radius:50%;background:#fff}
.clouds i:nth-child(1){width:110px;top:16%;left:6%}
.clouds i:nth-child(2){width:76px;top:30%;left:58%;animation-duration:120s;animation-delay:-40s}
.clouds i:nth-child(3){width:90px;top:8%;left:80%;animation-duration:105s;animation-delay:-70s}
@keyframes drift{from{transform:translateX(-12vw)}to{transform:translateX(16vw)}}
.rays{position:absolute;inset:-30% -10% 30% -10%;z-index:0;pointer-events:none;opacity:.5;
  background:repeating-conic-gradient(from 205deg at 50% -8%,rgba(255,255,255,.22) 0 5deg,transparent 5deg 15deg);
  -webkit-mask-image:linear-gradient(#000,transparent 75%);mask-image:linear-gradient(#000,transparent 75%);animation:raysw 22s ease-in-out infinite alternate}
.world[data-theme-n="1"] .rays{opacity:.18}
@keyframes raysw{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:58%;z-index:0}
.hills path:nth-child(1){fill:var(--h1)}.hills path:nth-child(2){fill:var(--h2)}.hills path:nth-child(3){fill:var(--h3)}
.arches{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.arches path{fill:none;stroke:rgba(255,255,255,.4);stroke-width:3;vector-effect:non-scaling-stroke}
.arches .thick{stroke-width:7;stroke:rgba(255,255,255,.28)}
.bugs{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.bf{position:absolute;left:-60px;width:34px;animation:fly 30s linear infinite}
.bf svg{width:100%;animation:flap .22s ease-in-out infinite alternate}
.bf.b2{width:26px;animation-duration:38s;animation-delay:-16s}
@keyframes fly{0%{transform:translate(-5vw,0)}20%{transform:translate(18vw,-40px)}40%{transform:translate(40vw,24px)}60%{transform:translate(62vw,-50px)}80%{transform:translate(84vw,16px)}100%{transform:translate(112vw,-30px)}}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.35)}}
.fireflies{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:var(--night)}
.fireflies i{position:absolute;width:6px;height:6px;border-radius:50%;background:#FFF3A8;box-shadow:0 0 10px 4px rgba(255,243,168,.7);animation:ff 6s ease-in-out infinite}
.fireflies i:nth-child(1){left:12%;top:46%}.fireflies i:nth-child(2){left:28%;top:62%;animation-delay:-2s}.fireflies i:nth-child(3){left:44%;top:40%;animation-delay:-4s}
.fireflies i:nth-child(4){left:63%;top:58%;animation-delay:-1s}.fireflies i:nth-child(5){left:78%;top:44%;animation-delay:-3s}.fireflies i:nth-child(6){left:90%;top:64%;animation-delay:-5s}
@keyframes ff{0%,100%{opacity:.1;transform:translate(0,0)}50%{opacity:1;transform:translate(14px,-18px)}}

/* =============== HUD =============== */
.hud{position:relative;z-index:6;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--hl);font-weight:800;font-size:1.2rem;white-space:nowrap;color:var(--ink);background:var(--glass);padding:5px 14px 5px 6px;border-radius:999px;backdrop-filter:blur(10px)}
[dir="rtl"] .brand{padding:5px 6px 5px 14px}
.brand .logo{width:34px;height:34px;border-radius:50%;background:var(--leaf);color:var(--on-leaf);display:grid;place-items:center}
.hudc{display:flex;align-items:center;gap:12px;background:var(--glass);padding:6px 14px;border-radius:999px;backdrop-filter:blur(10px);min-height:44px;max-width:100%}
.hudc:empty{display:none}
.hudc .rt{font-family:var(--hl);font-weight:700;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seeds{display:flex;gap:4px;align-items:center}
.seed{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink2);display:block;transition:background .4s,transform .4s}
.seed:nth-child(4n+1):not(:first-child){margin-inline-start:7px}
.seed.ok{background:var(--leaf);border-color:var(--leaf)}
.seed.re{background:var(--sun);border-color:var(--sun)}
.seed.cur{border-color:var(--ink);transform:scale(1.25)}
.controls{display:flex;gap:6px}
.ib{display:inline-grid;place-items:center;min-width:44px;min-height:44px;padding:0 10px;border-radius:50%;border:0;background:var(--glass);backdrop-filter:blur(10px);cursor:pointer;color:var(--ink);transition:transform .12s,background .12s}
.ib.txt{border-radius:999px;font-weight:500;font-size:.92rem}
.ib:hover{background:var(--glass-s)}
.ib:active{transform:scale(.94)}
.ib svg{width:22px;height:22px}
.ib .off{display:none}.ib[aria-pressed="true"] .on{display:none}.ib[aria-pressed="true"] .off{display:block}
.theme-ic-moon{display:block}.theme-ic-sun{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .theme-ic-moon{display:none}:root:not([data-theme="light"]) .theme-ic-sun{display:block}}
:root[data-theme="dark"] .theme-ic-moon{display:none}
:root[data-theme="dark"] .theme-ic-sun{display:block}
@media (max-width:640px){.hudc{order:3;width:100%;justify-content:center}.brand .nm{display:none}.brand{padding:5px}}

#view{position:relative;z-index:2;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.bubble,.view-anim{animation:viewin .6s ease both}
@keyframes viewin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* =============== Buttons =============== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border-radius:18px;border:0;background:var(--leaf);color:var(--on-leaf);font-weight:600;font-size:1.05rem;cursor:pointer;box-shadow:0 5px 0 var(--edge);transition:transform .12s,box-shadow .12s,filter .12s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--edge)}
.btn[disabled]{opacity:.5;cursor:default;filter:none;transform:none;box-shadow:0 5px 0 var(--edge)}
.btn svg{width:20px;height:20px}
.btn.alt{background:var(--glass-s);color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn.sm{min-height:44px;padding:0 18px;font-size:.95rem;border-radius:14px}
button.linklike{all:unset;cursor:pointer;color:var(--ink);text-decoration:underline;text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center;font-size:.95rem}
button.linklike:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

/* =============== Pots / plants =============== */
.potrow{position:relative;z-index:3;display:flex;justify-content:center;align-items:flex-end;gap:clamp(0px,1.6vw,30px);padding:0 10px;--pw:clamp(68px,min(21vw,24vh),220px)}
.pot{all:unset;box-sizing:border-box;position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;width:var(--pw);cursor:pointer;border-radius:18px;-webkit-tap-highlight-color:transparent;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
div.pot{cursor:default}
.pot:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
.ps{width:100%;height:auto;overflow:visible}
.pot[aria-current="true"]{transform:translateY(-3%) scale(1.16);z-index:2}
.pot[aria-current="true"]::before{content:"";position:absolute;z-index:-1;left:50%;bottom:10%;width:190%;aspect-ratio:1;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(255,244,190,.62),rgba(255,244,190,0) 70%);pointer-events:none}
.pot:not(div):not([aria-current="true"]):hover{transform:translateY(-2%)}
.tag{display:inline-flex;align-items:center;gap:6px;margin-top:-4px;padding:3px 12px 3px 8px;min-height:28px;border-radius:999px;background:var(--tag-bg);color:var(--tag-ink);font-size:.86rem;font-weight:600;line-height:1.2;box-shadow:0 2px 0 rgba(0,0,0,.2);white-space:nowrap;max-width:100%}
[dir="rtl"] .tag{padding:3px 8px 3px 12px}
.tag .stt{display:inline-flex;align-items:center}
.tag svg{width:14px;height:14px;flex:none}
.tag .ring{display:block;width:12px;height:12px;border-radius:50%;border:2px solid #5E7A71;flex:none}
.pot[aria-current="true"] .tag{background:var(--leaf);color:var(--on-leaf)}
.pot[aria-current="true"] .tag .ring{border-color:var(--on-leaf)}
.zzz{position:absolute;top:0;inset-inline-end:8%;font-family:var(--hl);font-weight:800;font-size:1.2rem;color:#fff;opacity:0;pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.pot[data-mood="sleep"] .zzz{opacity:.95;animation:zz 2.6s ease-in-out infinite}
@keyframes zz{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.stem{stroke:var(--stem);stroke-width:3.5;fill:none;stroke-linecap:round}
.lf.a{fill:var(--leafA)}.lf.b{fill:var(--leafB)}
.pet{fill:var(--pet)}.ctr{fill:var(--ctr)}.lav{fill:var(--lav)}
.sizer{transform-origin:50px 80px;transition:transform .9s cubic-bezier(.34,1.56,.64,1)}
.pot[data-skill="0"] .sizer{transform:scale(.88)}
.pot[data-skill="1"] .sizer{transform:scale(.58)}
.pot[data-skill="2"] .sizer{transform:scale(.8)}
.pot[data-skill="3"] .sizer{transform:scale(1.04)}
.plant{transform-origin:50px 80px;animation:sway 5.5s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
@keyframes sway{from{transform:rotate(-1.8deg)}to{transform:rotate(1.8deg)}}
.pot[data-state="thrive"] .plant{animation:grow .9s cubic-bezier(.34,1.56,.64,1) both,swayBig 5.5s ease-in-out .9s infinite alternate}
@keyframes grow{0%{transform:scale(.9)}100%{transform:scale(1.1)}}
@keyframes swayBig{from{transform:scale(1.1) rotate(-1.6deg)}to{transform:scale(1.1) rotate(1.6deg)}}
.pot[data-state="struggle"] .plant{animation:shake .6s ease-in-out 1 both;transform:rotate(-11deg) scaleY(.9);filter:saturate(.45) brightness(.94)}
@keyframes shake{0%,100%{transform:rotate(-11deg) scaleY(.9)}25%{transform:rotate(-4deg) scaleY(.92)}50%{transform:rotate(-14deg) scaleY(.88)}75%{transform:rotate(-7deg) scaleY(.9)}}
.bloom{opacity:0;transform-origin:50px 24px}
.pot[data-state="thrive"] .bloom{opacity:1;animation:pop .8s .3s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
.bloom path{fill:var(--sun);stroke:#fff;stroke-width:.8}
.pot-body,.pot-rim{stroke:rgba(0,0,0,.14);stroke-width:1}
.armo{fill:none;stroke:rgba(0,0,0,.2);stroke-width:6.5;stroke-linecap:round}
.armi{fill:none;stroke-width:4.4;stroke-linecap:round}
.arm{transition:transform .4s}
.arm.l{transform-origin:25px 93px}.arm.r{transform-origin:75px 93px}
.pot[data-mood="cheer"] .arm.l{animation:waveL .5s ease-in-out infinite alternate}
.pot[data-mood="cheer"] .arm.r{animation:waveR .5s .12s ease-in-out infinite alternate}
@keyframes waveL{from{transform:rotate(0)}to{transform:rotate(38deg)}}
@keyframes waveR{from{transform:rotate(0)}to{transform:rotate(-38deg)}}
.pot[data-mood="sad"] .arm.l,.pot[data-mood="hurt"] .arm.l{transform:rotate(-14deg)}
.pot[data-mood="sad"] .arm.r,.pot[data-mood="hurt"] .arm.r{transform:rotate(14deg)}
.pot[data-mood="happy"] .arm.l{transform:rotate(10deg)}.pot[data-mood="happy"] .arm.r{transform:rotate(-10deg)}
.pot[data-mood="unsure"] .arm.r{animation:scratch .7s ease-in-out infinite alternate}
@keyframes scratch{from{transform:rotate(0)}to{transform:rotate(-30deg)}}
.face .eyes{transform-origin:50px 98px;animation:blink 6s infinite;animation-delay:var(--d,0s)}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.face .eye{fill:#1B2B28}.face .gl{fill:#fff}
.face .mouth,.face .closed,.face .cheek,.face .eh,.face .brow,.face .sweat{display:none;fill:none;stroke:#1B2B28;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.face .cheek{fill:#F2778F;stroke:none;opacity:.55}
.face .m-c{fill:#7E2B3C}
.face .sweat{fill:#7CC6F2;stroke:#3E8FC7;stroke-width:1}
.pot .e-open{display:inline}
.pot[data-mood="neutral"] .m-n,.pot[data-mood="sleep"] .m-n{display:inline}
.pot[data-mood="happy"] .m-h,.pot[data-mood="happy"] .cheek{display:inline}
.pot[data-mood="cheer"] .m-c,.pot[data-mood="cheer"] .cheek,.pot[data-mood="cheer"] .eh{display:inline}
.pot[data-mood="cheer"] .eyes{display:none}
.pot[data-mood="sad"] .m-s,.pot[data-mood="sad"] .brow-s,.pot[data-mood="hurt"] .m-s,.pot[data-mood="hurt"] .brow-s,.pot[data-mood="hurt"] .sweat{display:inline}
.pot[data-mood="unsure"] .m-u,.pot[data-mood="unsure"] .brow-u,.pot[data-mood="unsure"] .sweat{display:inline}
.pot[data-mood="sleep"] .eyes{display:none}.pot[data-mood="sleep"] .closed{display:inline}
/* tool fx inside pots */
.fxg g{opacity:0}
@keyframes fxFade{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}
.pot[data-fx="stake"] .fx-stake{animation:fxStake 1.8s both}
@keyframes fxStake{0%{opacity:0;transform:translateY(-44px)}28%{opacity:1;transform:translateY(4px)}38%{transform:translateY(0)}85%{opacity:1;transform:translateY(0)}100%{opacity:0}}
.pot[data-fx="coach"] .fx-shears{animation:fxFade 1.8s both}
.fx-shears .b1,.fx-shears .b2{transform-origin:68px 44px}
.pot[data-fx="coach"] .fx-shears .b1{animation:snipA .42s ease-in-out 4}
.pot[data-fx="coach"] .fx-shears .b2{animation:snipB .42s ease-in-out 4}
@keyframes snipA{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(2deg)}}
@keyframes snipB{0%,100%{transform:rotate(20deg)}50%{transform:rotate(-2deg)}}
.pot[data-fx="support"] .fx-water{animation:fxFade 1.9s both}
.fx-water .can{transform-origin:78px 14px;transform:rotate(-24deg)}
.fx-water .drop{opacity:0}
.pot[data-fx="support"] .fx-water .drop{animation:drip .7s ease-in infinite;animation-delay:calc(var(--k)*.1s)}
@keyframes drip{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(46px);opacity:0}}
.pot[data-fx="delegate"] .fx-sun{animation:fxSun 1.9s both}
.fx-sun{transform-origin:50px 16px}
@keyframes fxSun{0%{opacity:0;transform:scale(.2)}25%{opacity:1;transform:scale(1.2)}40%{transform:scale(1)}85%{opacity:1}100%{opacity:0}}
.fx-sun .rays2{transform-origin:50px 16px;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dragging .pot[aria-current="true"] .ps{filter:drop-shadow(0 0 16px #FFE58A) drop-shadow(0 0 4px #fff)}
.dragging .pot[aria-current="true"]{transform:translateY(-3%) scale(1.22)}

/* bench */
.bench{position:relative;z-index:2;flex:none;height:clamp(34px,5.4vh,52px);margin-top:-30px;background:linear-gradient(180deg,var(--wood1) 0 22%,var(--wood2) 22% 100%);box-shadow:0 -3px 0 rgba(255,255,255,.18) inset,0 10px 30px rgba(0,0,0,.25)}
.bench::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 120px,rgba(0,0,0,.14) 120px 122px)}
.bench::before{content:"";position:absolute;left:0;right:0;top:22%;height:2px;background:var(--wood3);opacity:.5}

/* =============== Play layout =============== */
.play{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.scene{position:relative;flex:1 1 auto;min-height:190px;display:flex;flex-direction:column;justify-content:flex-end}
.bubble{position:absolute;z-index:5;top:6px;left:50%;transform:translateX(-50%);width:max-content;max-width:min(560px,calc(100% - 20px));background:#fff;color:#12302A;border-radius:24px;padding:12px 18px 14px;box-shadow:0 14px 30px -12px rgba(0,0,0,.4);animation:bubin .5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes bubin{from{opacity:0;transform:translateX(-50%) scale(.85)}to{opacity:1;transform:translateX(-50%) scale(1)}}
.bubble::after{content:"";position:absolute;bottom:-11px;left:var(--tx,50%);width:22px;height:22px;background:#fff;border-radius:3px;transform:translateX(-50%) rotate(45deg)}
.bubble .bt{display:flex;gap:8px;align-items:flex-start;font-size:.86rem;font-weight:600;color:#3A574F;margin-bottom:4px}
.bubble .bt svg{width:18px;height:18px;flex:none;margin-top:2px}
.bubble q{display:block;quotes:none;font-size:1.12rem;line-height:1.5;font-weight:500}
[dir="rtl"] .bubble q{line-height:1.75}
.bubble .who2{display:block;font-size:.8rem;color:#3A574F;margin-top:4px}

.console{position:relative;z-index:4;flex:none;max-height:56dvh;overflow:auto;background:var(--glass);backdrop-filter:blur(16px);border-radius:28px 28px 0 0;box-shadow:0 -12px 40px -16px rgba(0,0,0,.45);padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 14px)}
.cwrap{max-width:1100px;margin:0 auto;display:grid;gap:12px 24px}
@media (min-width:900px){.cwrap{grid-template-columns:1fr 1fr;align-items:start}.cwrap .oops{grid-column:1/-1}}
.who h2{font-size:1.45rem}
.who .role{color:var(--ink2);font-size:.92rem}
.clues{display:grid;gap:8px;margin-top:8px}
.clue{all:unset;box-sizing:border-box;display:flex;align-items:flex-start;gap:10px;min-height:48px;padding:10px 14px;border-radius:6px 16px 16px 6px;background:var(--kraft);color:var(--paper-ink);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.18);position:relative;transition:transform .2s;font-size:.96rem;line-height:1.45}
[dir="rtl"] .clue{border-radius:16px 6px 6px 16px}
.clue::before{content:"";flex:none;width:12px;height:12px;border-radius:50%;background:rgba(0,0,0,.28);margin-top:5px;box-shadow:inset 0 2px 2px rgba(0,0,0,.35)}
.clue:hover{transform:rotate(-.6deg) translateY(-1px)}
.clue:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.clue .k{font-weight:600}
.clue .tp{opacity:.75;font-size:.88rem}
.clue.open{background:var(--paper);cursor:default;animation:flip .45s ease both}
.clue.open:hover{transform:none}
@keyframes flip{from{transform:rotateX(80deg);opacity:.4}to{transform:rotateX(0);opacity:1}}
.chips{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;background:var(--leaf-l);font-size:.9rem;color:var(--ink)}
.chip .k{font-weight:600}
.meter{display:inline-flex;gap:3px}
.meter i{width:9px;height:9px;border-radius:50%;border:1.8px solid var(--ink2);display:block}
.meter i.on{background:var(--ink);border-color:var(--ink)}
.dockwrap{display:grid;gap:10px}
.advisor{display:flex;gap:10px;align-items:flex-start}
.lia{flex:none;width:46px;height:46px;animation:hover 3s ease-in-out infinite}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.lia .wing{transform-origin:24px 22px;animation:flap2 .18s ease-in-out infinite alternate}
@keyframes flap2{from{transform:scaleX(1)}to{transform:scaleX(.82)}}
.say{position:relative;background:var(--glass-s);color:var(--ink);border-radius:6px 18px 18px 18px;padding:9px 14px;font-size:.95rem;line-height:1.45;box-shadow:0 2px 0 var(--line);flex:1;min-width:0}
[dir="rtl"] .say{border-radius:18px 6px 18px 18px}
.say b{font-weight:600}
.say .use{margin-top:8px}
.dock{display:flex;justify-content:center;gap:clamp(8px,2.2vw,18px)}
.tool{all:unset;box-sizing:border-box;touch-action:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:clamp(70px,22%,104px);cursor:grab;border-radius:20px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.tool:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.tool .ico{width:clamp(58px,15vw,76px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--tc);border:3px solid var(--glass-s);box-shadow:0 5px 0 rgba(0,0,0,.18),0 10px 18px -8px rgba(0,0,0,.4);transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .2s}
.tool .ico svg{width:56%;height:56%;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool b{font-size:.84rem;font-weight:600;text-align:center;line-height:1.2}
.tool:hover .ico{transform:translateY(-3px)}
.tool[aria-pressed="true"] .ico{transform:translateY(-8px) scale(1.12);box-shadow:0 0 0 5px var(--leaf),0 14px 22px -8px rgba(0,0,0,.5);animation:wob 1.4s ease-in-out infinite}
@keyframes wob{0%,100%{rotate:-4deg}50%{rotate:4deg}}
.tool[aria-disabled="true"]{cursor:default}
.tool[aria-disabled="true"] .ico{filter:grayscale(.6);opacity:.55}
.tool.locked .ico{animation:nope .35s}
@keyframes nope{0%,100%{translate:0}25%{translate:-6px}75%{translate:6px}}
.tool .used{position:absolute;margin-top:-6px;inset-inline-start:calc(50% + 14px);width:22px;height:22px;border-radius:50%;background:var(--berry);color:#fff;display:grid;place-items:center}
.tool{position:relative}
.tool .used svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:3}
.ghost{position:fixed;z-index:60;pointer-events:none;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;display:grid;place-items:center;background:var(--tc);border:3px solid #fff;box-shadow:0 20px 30px -10px rgba(0,0,0,.5);transform:scale(1.15) rotate(-8deg)}
.ghost svg{width:52px;height:52px;stroke:#12302A;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.oops{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:18px;background:var(--berry-l);color:var(--ink);animation:bubin2 .4s ease both}
@keyframes bubin2{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.oops .bub{flex:none;width:34px;height:34px;border-radius:50%;background:var(--berry);display:grid;place-items:center}
.oops .bub svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round}
.oops h3{font-size:1.05rem;color:var(--berry)}
.oops p{font-size:.95rem;max-width:54em}

/* journal (result) */
.journal{position:relative;grid-column:1/-1;max-width:760px;margin:6px auto 0;background:var(--paper);color:var(--paper-ink);border-radius:8px 22px 22px 22px;padding:20px 24px 22px;box-shadow:0 14px 30px -14px rgba(0,0,0,.5);animation:jin .6s cubic-bezier(.34,1.3,.64,1) both}
@keyframes jin{from{opacity:0;transform:translateY(40px) rotate(2deg)}to{opacity:1;transform:rotate(-.4deg)}}
.journal::before{content:"";position:absolute;top:-12px;left:50%;width:90px;height:24px;transform:translateX(-50%) rotate(-3deg);background:rgba(245,183,60,.75);border-radius:3px;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.journal .jh{display:flex;gap:14px;align-items:center}
.journal .okb{flex:none;width:46px;height:46px;border-radius:50%;background:#1E7A4C;display:grid;place-items:center}
.journal .okb svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.journal h3{font-size:1.4rem}
.journal .tagline{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:500;padding:2px 10px;border-radius:999px;background:#E3F2E8;margin-top:2px}
.journal .tagline svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.8}
.journal p.why{margin-top:12px;font-size:1.06rem;max-width:44em}
.journal .stg{margin-top:12px;padding-top:10px;border-top:2px dashed #CDBF9A;font-size:.93rem;color:#3A574F}
.journal .btn{margin-top:16px}

/* overlay cards */
.ov{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(6,20,17,.45);backdrop-filter:blur(6px);animation:fadein .4s ease both;overflow:auto}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.ovc{width:min(560px,100%);background:var(--paper);color:var(--paper-ink);border-radius:28px;padding:26px 26px 28px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);animation:jin2 .6s cubic-bezier(.34,1.4,.64,1) both;text-align:start}
@keyframes jin2{from{opacity:0;transform:translateY(30px) scale(.92)}to{opacity:1;transform:none}}
.ovc .big{font-family:var(--hl);font-weight:800;font-size:clamp(2.4rem,9vw,3.6rem);line-height:1;color:var(--leaf-d)}
html:not([data-theme="dark"]) .ovc h2{color:#12302A}
.ovc h2{font-size:1.9rem;margin-top:6px;color:#12302A}
.ovc p.rule{margin-top:12px;font-size:1.08rem;max-width:34em}
.ovc .btn{margin-top:22px}
.ovc .sc{margin-top:6px;font-size:1.1rem;font-weight:500}
.sumlist{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
.sumlist li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 12px;border-radius:14px;background:#fff;border:1px solid #E2D7B8}
.sumlist .st{width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.sumlist .st svg{width:18px;height:18px;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.st.ok{background:#1E7A4C}.st.ok svg{stroke:#fff}
.st.re{background:#F5B73C}.st.re svg{stroke:#3A2A00}
.sumlist .nm{font-weight:600}.sumlist .sub{font-size:.85rem;color:#3A574F}
.sumlist .rs{font-size:.85rem;color:#3A574F;text-align:end}
.remember{margin-top:16px;padding:12px 16px;border-radius:16px;background:#FFF1CC;color:#12302A}
.remember h3{font-size:1.02rem;margin-bottom:2px}

/* =============== Cover =============== */
.cover{flex:1;min-height:0;display:flex;flex-direction:column}
.ctext{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 20px;gap:14px}
.ctext h1{font-size:clamp(3rem,11vw,6.6rem);font-weight:800;line-height:.95;color:#fff;text-shadow:0 4px 0 rgba(18,88,58,.55),0 14px 40px rgba(0,0,0,.35)}
[dir="rtl"] .ctext h1{line-height:1.2}
.ctext .lead{font-size:clamp(1.02rem,2.6vw,1.3rem);max-width:30em;color:#fff;font-weight:400;background:rgba(8,36,28,.58);backdrop-filter:blur(8px);padding:10px 20px;border-radius:20px}
.cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:4px}
.meta{display:inline-flex;gap:8px;align-items:center;color:#fff;font-size:.9rem;background:rgba(8,36,28,.58);backdrop-filter:blur(8px);padding:5px 14px;border-radius:999px}
.meta svg{width:18px;height:18px}
.cover .potrow{--pw:clamp(84px,min(20vw,28vh),240px)}

/* =============== Lab =============== */
.lab{flex:1;min-height:0;display:grid;grid-template-rows:minmax(150px,34%) 1fr}
@media (min-width:900px){.lab{grid-template-rows:none;grid-template-columns:1fr minmax(380px,470px);gap:10px}}
.labscene{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:0}
.labscene .potrow{--pw:clamp(110px,min(38vw,40vh),340px)}
.labscene .bubble{top:2px}
.labpanel{background:var(--glass);backdrop-filter:blur(16px);border-radius:28px 28px 0 0;box-shadow:0 -12px 40px -16px rgba(0,0,0,.45);padding:18px 20px calc(env(safe-area-inset-bottom,0px) + 18px);overflow:auto;min-height:0}
@media (min-width:900px){.labpanel{border-radius:28px;margin:0 14px 14px 0}}
[dir="rtl"] .labpanel{}
.labpanel h2{font-size:1.7rem}
.labpanel .li{margin-top:4px;color:var(--ink2);max-width:36em}
.dial{margin-top:10px}
.dial h3{font-size:1.02rem;display:flex;align-items:center;gap:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.seg button{all:unset;box-sizing:border-box;min-height:50px;padding:6px 8px;border-radius:14px;border:2px solid var(--line);background:var(--glass-s);text-align:center;cursor:pointer;font-size:.92rem;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:0 3px 0 var(--line);transition:transform .12s,box-shadow .12s}
.seg button:hover{border-color:var(--leaf)}
.seg button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.seg button[aria-checked="true"]{background:var(--leaf);color:var(--on-leaf);border-color:var(--leaf);box-shadow:0 3px 0 var(--edge)}
.seg button[aria-checked="true"] .meter i{border-color:var(--on-leaf)}
.seg button[aria-checked="true"] .meter i.on{background:var(--on-leaf)}
.seg button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.read{margin-top:12px;padding:12px 14px;border-radius:20px;background:var(--glass-s);border:2px dashed var(--line);min-height:112px}
.read h3{font-size:1.2rem}
.read .off{font-size:.8rem;color:var(--ink2);font-style:italic}
.read .rs{display:flex;gap:12px;align-items:center;margin-top:10px;padding:10px;border-radius:16px;background:var(--tc)}
.read .rs .ico{flex:none;width:48px;height:48px;border-radius:50%;background:var(--glass-s);display:grid;place-items:center}
.read .rs .ico svg{width:28px;height:28px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.read .rs b{display:block}
.read .rs small{font-size:.88rem;line-height:1.4;color:var(--ink)}
.read.mixed{border-style:solid;background:var(--sun-l)}
.found{margin-top:10px}
.found p{font-weight:600;font-size:.95rem}
.fchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.fchip{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:4px 14px;border-radius:999px;border:2px solid var(--line);background:var(--glass-s);font-size:.9rem;font-weight:500}
.fchip:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.fchip svg{width:16px;height:16px}
.fchip.on{background:var(--leaf-l);border-color:var(--leaf)}
.fchip .ring{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink2)}
.labbtns{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:12px;position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));padding:10px 0 12px;background:var(--glass-s);border-radius:16px}

/* =============== Final =============== */
.final{flex:1;min-height:0;display:flex;flex-direction:column}
.final .potrow{--pw:clamp(80px,min(19vw,24vh),200px)}
.fscene{flex:none;position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:clamp(170px,32vh,330px)}
.fsheet{flex:1;min-height:0;overflow:auto;background:var(--glass);backdrop-filter:blur(16px);border-radius:28px 28px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 22px);box-shadow:0 -12px 40px -16px rgba(0,0,0,.45)}
.fgrid{max-width:1100px;margin:0 auto;display:grid;gap:16px}
@media (min-width:900px){.fgrid{grid-template-columns:1fr 1fr;gap:18px 26px}.fgrid .full{grid-column:1/-1}}
.fcard{background:var(--glass-s);border-radius:24px;padding:20px 22px;box-shadow:var(--shadow)}
.fcard h2{font-size:clamp(1.8rem,5vw,2.6rem)}
.fcard h3{font-size:1.25rem}
.bigscore{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.bigscore .n{font-family:var(--hl);font-weight:800;font-size:4rem;line-height:1;color:var(--leaf-d)}
:root[data-theme="dark"] .bigscore .n{color:var(--leaf)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bigscore .n{color:var(--leaf)}}
.bigscore .o{font-size:1.1rem;color:var(--ink2)}
.msg{font-size:1.08rem;margin-top:6px;max-width:30em}
.bys{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.bys li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 12px;border-radius:16px;background:var(--tc);}
.bys .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--glass-s)}
.bys .ico svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bys b{font-weight:600;display:block}.bys small{color:var(--ink);font-size:.84rem}
.bys li:nth-child(1){--tc:var(--t1)}.bys li:nth-child(2){--tc:var(--t2)}.bys li:nth-child(3){--tc:var(--t3)}.bys li:nth-child(4){--tc:var(--t4)}
.dots{display:flex;gap:6px}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.dot svg{width:15px;height:15px;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.dot.ok{background:var(--leaf)}.dot.ok svg{stroke:var(--on-leaf)}
.dot.re{background:var(--sun)}.dot.re svg{stroke:#3A2A00}
.three{margin:10px 0 0;padding-inline-start:22px}.three li{margin:6px 0;max-width:34em}
textarea{width:100%;min-height:104px;margin-top:10px;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--glass-s);color:var(--ink);font:inherit;line-height:1.5;resize:vertical}
.row-btns{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:12px}
.count{font-size:.9rem;color:var(--ink2)}

/* =============== Dialogs (About deck / Stages guide) =============== */
dialog{padding:0;border:0;background:transparent;color:var(--ink);max-width:none;max-height:none}
dialog::backdrop{background:rgba(4,14,12,.7);backdrop-filter:blur(5px)}
dialog.deck{width:min(1120px,96vw);height:min(760px,94dvh);margin:auto}
dialog.sheet{width:min(960px,96vw);max-height:94dvh;margin:auto}
.dk{display:flex;flex-direction:column;height:100%;max-height:94dvh;background:var(--glass-s);border-radius:30px;overflow:hidden;box-shadow:0 40px 90px -20px rgba(0,0,0,.7);border:1px solid var(--line)}
.dkbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 8px}
.dkbar .tt{font-family:var(--hl);font-weight:700;font-size:1.05rem}
.dkslides{flex:1;min-height:0;overflow:auto;padding:6px 26px 14px}
.dkfoot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 14px);border-top:1px solid var(--line)}
.pgs{display:flex;gap:8px;align-items:center}
.pgs button{all:unset;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;border-radius:50%}
.pgs button::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--line);transition:all .25s}
.pgs button[aria-current="true"]::before{width:30px;border-radius:8px;background:var(--leaf)}
.pgs button:focus-visible{outline:3px solid var(--focus)}
.sl{display:grid;gap:22px;align-items:center;min-height:100%;animation:viewin .45s ease both}
@media (min-width:860px){.sl{grid-template-columns:1fr 1.15fr;gap:40px}.sl.one{grid-template-columns:1fr}}
.sl h2{font-size:clamp(1.9rem,4.6vw,3rem);line-height:1.1}
.sl .kick{font-size:.95rem;font-weight:600;color:var(--leaf-d);margin-bottom:6px}
:root[data-theme="dark"] .sl .kick{color:var(--leaf)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sl .kick{color:var(--leaf)}}
.sl p.t{font-size:1.1rem;margin-top:12px;max-width:34em;color:var(--ink)}
.sl .note{margin-top:14px;padding:10px 14px;border-radius:14px;background:var(--sun-l);font-size:.93rem;max-width:36em}
.vis{display:flex;align-items:center;justify-content:center;min-width:0}
.facts{display:grid;gap:8px;margin-top:16px;max-width:30em}
.facts div{display:flex;justify-content:space-between;gap:16px;padding:8px 14px;border-radius:14px;background:var(--leaf-l)}
.facts b{font-weight:600}
.pair{display:flex;gap:10px;align-items:flex-end;justify-content:center;--pw:clamp(90px,18vw,170px)}
.pair .mid{display:grid;place-items:center;gap:6px;padding-bottom:50px}
.pair .mid .ico{width:56px;height:56px;border-radius:50%;background:var(--t1);display:grid;place-items:center}
.pair .mid .ico svg{width:32px;height:32px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}
.model{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%}
.mc{display:grid;gap:8px;padding:12px 10px;border-radius:18px;background:var(--tc);align-content:start}
.mc h4{margin:0;font-family:var(--hl);font-size:.98rem;line-height:1.2}
.mc .bl{font-size:.74rem;display:grid;gap:3px}
.bar{display:flex;gap:3px}.bar i{flex:1;height:8px;border-radius:4px;background:rgba(0,0,0,.14)}.bar i.on{background:var(--ink)}
.mc .sty{display:flex;align-items:center;gap:6px;font-weight:600;font-size:.88rem;margin-top:4px}
.mc .sty span.ico{width:30px;height:30px;border-radius:50%;background:var(--glass-s);display:grid;place-items:center;flex:none}
.mc .sty svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.model .mc:nth-child(1){--tc:var(--t1)}.model .mc:nth-child(2){--tc:var(--t2)}.model .mc:nth-child(3){--tc:var(--t3)}.model .mc:nth-child(4){--tc:var(--t4)}
@media (max-width:640px){.model{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl th,.tbl td{border:1px solid var(--line);padding:9px 11px;text-align:start;vertical-align:top}
.tbl th{background:var(--leaf-l)}
.tw{overflow-x:auto;width:100%}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-top:14px}
.fn{padding:8px 14px;border-radius:14px;background:var(--leaf-l);font-weight:600;font-size:.92rem}
.legend{display:grid;gap:10px;width:100%}
.lg{display:grid;grid-template-columns:90px 1fr;gap:14px;align-items:center;padding:8px 12px;border-radius:18px;background:var(--leaf-l)}
.lg .pair{--pw:70px;gap:2px}
.lg p{font-size:.95rem}
.dl{display:grid;gap:10px;margin:14px 0 0;padding:0;list-style:none;max-width:40em}
.dl li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:10px 14px;border-radius:16px;background:var(--leaf-l)}
.dl .ico{width:30px;height:30px;border-radius:50%;background:var(--leaf);color:var(--on-leaf);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.cols3{display:grid;gap:12px;margin-top:14px}
@media (min-width:760px){.cols3{grid-template-columns:repeat(3,1fr)}}
.cols3>div{padding:14px 16px;border-radius:18px;background:var(--leaf-l)}
.cols3 h3{font-size:1.05rem;margin-bottom:4px}
.cols3 ul{margin:4px 0 0;padding-inline-start:20px}.cols3 li{margin:3px 0;font-size:.95rem}
.two{display:grid;gap:14px}
@media (min-width:760px){.two{grid-template-columns:1fr 1fr}}
.two>div{padding:14px 16px;border-radius:18px;background:var(--leaf-l)}
.two h3{font-size:1.05rem;margin-bottom:4px}.two ul{margin:4px 0 0;padding-inline-start:20px}.two li{margin:4px 0;font-size:.95rem}
.two>div.warn{background:var(--sun-l)}
.sc4{display:grid;gap:10px;padding:16px;border-radius:22px;background:var(--glass-s);border:1px solid var(--line)}
.gd{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:12px}
@media (min-width:760px){.gd{grid-template-columns:repeat(4,1fr)}}
.sc4 .mp{width:56px;height:56px}
.sc4 h3{font-size:1.1rem}.sc4 .off{font-size:.8rem;color:var(--ink2);font-style:italic}
.sc4 .style{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:10px;border-radius:16px;background:var(--tc)}
.sc4 .style .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--glass-s)}
.sc4 .style .ico svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sc4 .style b{display:block;font-weight:600}.sc4 .style small{display:block;font-size:.84rem;line-height:1.4}
.gd li:nth-child(1) .style{--tc:var(--t1)}.gd li:nth-child(2) .style{--tc:var(--t2)}.gd li:nth-child(3) .style{--tc:var(--t3)}.gd li:nth-child(4) .style{--tc:var(--t4)}
.mini .stemm{stroke:var(--stem);stroke-width:3;fill:none;stroke-linecap:round}.mini .l1{fill:var(--leafA)}.mini .l2{fill:var(--leafB)}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 16px 0}
.shead h2{font-size:1.9rem}
.sbody{padding:6px 22px 24px;overflow:auto;max-height:calc(94dvh - 80px)}
.sbody .gi{color:var(--ink2);max-width:40em;margin-top:2px}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:50;pointer-events:none}

@media (max-height:620px) and (orientation:landscape){
  .console{max-height:62dvh}.bubble q{font-size:1rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}
  .rays,.clouds i,.bf{display:none}
}
</style>
</head>

/* actions: play */
function tapTool(i, viaKey) {
  if (S.phase !== 'decide') return;
  var p = person(S.active), R = S.res[p.id];
  if (R.attempts.indexOf(i) > -1) return;
  if (locked()) {
    S.adv = T().advLocked; S.sel = null; renderConsole();
    $$('.tool').forEach(function (b) { b.classList.add('locked'); });
    Snd.sfx('lose'); return;
  }
  S.adv = null;
  if (S.sel === i) { applyTool(i); return; }
  S.sel = i; Snd.sfx('select');
  renderConsole(viaKey ? '.tool[data-i="' + i + '"]' : null);
}
function applyTool(i) {
  var p = person(S.active), R = S.res[p.id];
  if (S.phase !== 'decide' || R.done || R.attempts.indexOf(i) > -1 || locked()) return;
  S.sel = null; S.adv = null; R.attempts.push(i); S.fromSummary = false;
  var ok = i === p.stage - 1, pot = $('.pot[data-id="' + p.id + '"]');
  toolSound(i); if (i === 2) burstAt(pot, 'rain', 22);
  if (ok) {
    R.done = true; R.first = R.attempts.length === 1; S.vis[p.id].mood = 'cheer'; S.vis[p.id].state = 'thrive'; S.phase = 'result';
    setTimeout(function () { Snd.sfx('win'); burstAt($('.pot[data-id="' + p.id + '"]'), 'petals', 56); }, reduce ? 0 : 700);
  } else {
    S.vis[p.id].mood = 'hurt'; S.vis[p.id].state = 'struggle';
    setTimeout(function () { Snd.sfx('lose'); burstAt($('.pot[data-id="' + p.id + '"]'), 'dust', 16); }, reduce ? 0 : 700);
  }
  updatePots(); playFx(p.id, STYLES[i].fx); renderHud();
  renderConsole(ok ? '#jt' : '.tool:not([aria-disabled="true"])');
  say(ok ? fmt(T().best, { style: tx(STYLES[i].n) }) : T().notBest);
}
function openClue(i) {
  var p = person(S.active); S.open[p.id][i] = true; S.adv = null; Snd.sfx('paper');
  var bothOpen = S.open[p.id][0] && S.open[p.id][1];
  var nextClosed = S.open[p.id][0] ? null : S.open[p.id][1] ? null : null;
  renderConsole(bothOpen ? '.tool' : '.clue[data-act="clue"]');
}
function goNext() {
  var list = roundPeople(S.round), idx = list.map(function (p) { return p.id; }).indexOf(S.active), j, c;
  S.sel = null; S.adv = null;
  for (j = 1; j <= list.length; j++) {
    c = list[(idx + j) % list.length];
    if (!S.res[c.id].done) { S.active = c.id; S.phase = 'decide'; updatePots(); renderHud(); renderBubble(); renderConsole('.clue[data-act="clue"],.tool'); Snd.sfx('pop'); return; }
  }
  S.ov = 'end'; Snd.sfx('round'); burstAt($('#potrow'), 'petals', 70); renderOv();
}
function selectPerson(id) {
  if (S.ov) return;
  var R = S.res[id]; S.active = id; S.sel = null; S.adv = null; S.phase = R.done ? 'result' : 'decide';
  S.fromSummary = doneCount(roundPeople(S.round)) === 4;
  Snd.sfx('pop'); updatePots(); renderHud(); renderBubble(); renderConsole();
}

    '<div><h3>' + X('Before', 'قبل') + '</h3><ul><li>' + X('Play it once yourself.', 'العبه مرة بنفسك.') + '</li><li>' + X('Share the goal: choose the style that fits the person and the task.', 'شارك الهدف: اختر الأسلوب الذي يناسب الشخص والمهمة.') + '</li><li>' + X('Check the sound and the screen.', 'تحقق من الصوت والشاشة.') + '</li></ul></div>' +
    '<div><h3>' + X('During', 'أثناء') + '</h3><ul><li>' + X('Play alone, or in pairs who agree before using a tool.', 'العب وحدك، أو في أزواج يتفقون قبل استخدام الأداة.') + '</li><li>' + X('Let players retry. Mistakes show what happens.', 'اسمح بإعادة المحاولة. الأخطاء تُظهر ما يحدث.') + '</li><li>' + X('Stay quiet unless asked.', 'التزم الصمت إلا إذا طُلب منك.') + '</li></ul></div>' +
    '<div><h3>' + X('After', 'بعد') + '</h3><ul><li>' + X('Ask the debrief questions.', 'اطرح أسئلة النقاش.') + '</li><li>' + X('Link each answer to a real person on the team.', 'اربط كل إجابة بشخص حقيقي في الفريق.') + '</li><li>' + X('Ask for one action for this week.', 'اطلب خطوة واحدة لهذا الأسبوع.') + '</li></ul></div></div></div></div>');
  // 8 debrief
  var qs = [X('Who was hardest to read? What made that person hard to read?', 'من كان أصعب في القراءة؟ وما الذي جعله صعبًا؟'), X('Where did a person’s words and the evidence disagree?', 'أين اختلف كلام الشخص عن الأدلة؟'), X('Think of a time a leader gave you too much or too little direction. What happened?', 'تذكّر مرة أعطاك فيها قائد توجيهًا زائدًا أو ناقصًا. ماذا حدث؟'), X('Which style do you use most often? Which do you use least?', 'أي أسلوب تستخدمه أكثر؟ وأيّها تستخدمه أقل؟'), X('Who on your team is in a different stage for a new task right now?', 'من في فريقك في مرحلة مختلفة الآن بسبب مهمة جديدة؟'), X('What will you do differently this week?', 'ماذا ستفعل بشكل مختلف هذا الأسبوع؟')];
  s.push('<div class="sl one"><div><div class="kick">' + X('Debrief', 'النقاش بعد اللعب') + '</div><h2>' + X('Six questions to ask', 'ستة أسئلة للنقاش') + '</h2><ul class="dl">' +
    qs.map(function (q, i) { return '<li><span class="ico">' + (i + 1) + '</span><span>' + q + '</span></li>'; }).join('') + '</ul></div></div>');
  // 9 quality & limits
  s.push('<div class="sl one"><div><div class="kick">' + X('Quality and limits', 'الجودة والحدود') + '</div><h2>' + X('What is checked, and what is not', 'ما الذي روجع وما الذي لم يُراجع') + '</h2><div class="two" style="margin-top:16px">' +
    '<div><h3>' + X('Checked', 'روجع') + '</h3><ul><li>' + X('Every path was played in a browser: right answers, wrong answers, and retries.', 'لُعبت كل المسارات في المتصفح: الإجابات الصحيحة والخاطئة وإعادة المحاولة.') + '</li><li>' + X('English and Arabic, light and dark mode.', 'العربية والإنجليزية، والوضع الفاتح والداكن.') + '</li><li>' + X('Each round has one person per stage, and each stage has one correct style.', 'كل جولة فيها شخص واحد لكل مرحلة، ولكل مرحلة أسلوب صحيح واحد.') + '</li><li>' + X('Keyboard use, screen reader labels, reduced motion, optional sound, and meaning that never depends on color alone were built in. Screen readers were not tested.', 'تم تضمين الاستخدام بلوحة المفاتيح، وتسميات قارئات الشاشة، وتقليل الحركة، والصوت الاختياري، ومعنى لا يعتمد على اللون وحده. لم تُختبر قارئات الشاشة.') + '</li></ul></div>' +
    '<div class="warn"><h3>' + X('Not done yet', 'لم يتم بعد') + '</h3><ul><li>' + X('No testing with real learners.', 'لم يُختبر مع متعلمين حقيقيين.') + '</li><li>' + X('People and scenarios are fictional and were written for this activity.', 'الأشخاص والمواقف خيالية وكُتبت لهذا النشاط.') + '</li><li>' + X('Time estimates are not measured.', 'تقديرات الوقت غير مقاسة.') + '</li><li>' + X('Model terms need a check against your licensed material.', 'مصطلحات النموذج تحتاج إلى مراجعة مع مادتك المرخّصة.') + '</li><li>' + X('The score starts a conversation. It does not assess ability.', 'النتيجة تبدأ نقاشًا. ولا تقيّم القدرة.') + '</li></ul></div></div></div></div>');
  return s;
}
function openDlg(mode) {
  var d = $('#dlg'); S.dlg = mode;
  d.className = mode === 'about' ? 'deck' : 'sheet';
  if (mode === 'about') renderDeck(); else renderGuideDlg();
  if (!d.open) { if (d.showModal) d.showModal(); else d.setAttribute('open', ''); }
  var f = $('#dlg [data-focus]'); if (f) f.focus();
}
function renderDeck() {
  var t = T(), sl = slides(), n = sl.length; S.slide = Math.max(0, Math.min(n - 1, S.slide));
  $('#dlg').setAttribute('aria-label', t.about);
  $('#dlg').innerHTML = '<div class="dk"><div class="dkbar"><span class="tt">' + t.about + '</span><button type="button" class="ib" data-act="closeDlg" aria-label="' + t.close + '">' + IC.close + '</button></div>' +
    '<div class="dkslides" id="dkslides" tabindex="-1" aria-live="polite">' + sl[S.slide] + '</div>' +
    '<div class="dkfoot"><button type="button" class="btn alt sm" data-act="dprev"' + (S.slide === 0 ? ' disabled' : '') + ' data-focus>' + IC.prev + t.prev + '</button>' +
    '<div class="pgs" role="group" aria-label="' + fmt(t.slideOf, { a: S.slide + 1, b: n }) + '">' + sl.map(function (x, i) { return '<button type="button" data-act="dgo" data-i="' + i + '"' + (i === S.slide ? ' aria-current="true"' : '') + ' aria-label="' + fmt(t.slideOf, { a: i + 1, b: n }) + '"></button>'; }).join('') + '</div>' +
    '<button type="button" class="btn sm" data-act="dnext"' + (S.slide === n - 1 ? ' disabled' : '') + '>' + t.next + IC.arrow + '</button></div></div>';
}
function renderGuideDlg() {
  var t = T();
  $('#dlg').setAttribute('aria-label', t.guideTitle);
  $('#dlg').innerHTML = '<div class="dk"><div class="shead"><h2>' + t.guideTitle + '</h2><button type="button" class="ib" data-act="closeDlg" aria-label="' + t.close + '" data-focus>' + IC.close + '</button></div><div class="sbody">' + stagesGuideHTML() + '</div></div>';
}

/* =====================================================
   Navigation + render
   ===================================================== */
function setView(v) {
  S.view = v; S.ov = null; S.sel = null; S.adv = null;
  if (v === 'play') { S.ov = S.ov || 'intro'; }
  render(true);
}
function render(focusTitle) {
  document.documentElement.lang = S.lang; document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  document.title = S.lang === 'ar' ? 'حديقة الفريق | Team Garden' : 'Team Garden | حديقة الفريق';
  setTime(); renderHud();
  if (S.view === 'cover') renderCover();
  else if (S.view === 'lab') renderLab();
  else if (S.view === 'play') renderPlay();
  else renderFinal();
  if (focusTitle) { var h = $('#pageTitle'); if (h) { try { h.focus({ preventScroll: true }); } catch (e) { h.focus(); } } }
  if (S.view === 'play') requestAnimationFrame(positionBubble);
}
function beginRound() { S.round = Math.max(1, S.round); S.active = null; S.ov = 'intro'; S.view = 'play'; render(false); }

/* =====================================================
   Events
   ===================================================== */
var drag = null, ghost = null;
function startGhost(i) {
  ghost = document.createElement('div'); ghost.className = 'ghost'; ghost.style.setProperty('--tc', 'var(--t' + (i + 1) + ')'); ghost.innerHTML = toolIcon(i);
  document.body.appendChild(ghost); $('#world').classList.add('dragging');
}
function endGhost() { if (ghost) { ghost.remove(); ghost = null; } $('#world').classList.remove('dragging'); }

document.addEventListener('pointerdown', function (e) {
  var tl = e.target.closest && e.target.closest('.tool'); if (!tl || S.view !== 'play' || S.phase !== 'decide' || S.ov) return;
  if (e.button > 0) return;
  drag = { i: +tl.getAttribute('data-i'), x: e.clientX, y: e.clientY, moved: false };
});
document.addEventListener('pointermove', function (e) {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 12) {
    var p = person(S.active), R = S.res[p.id];
    if (locked() || R.attempts.indexOf(drag.i) > -1) { drag = null; return; }
    drag.moved = true; S.sel = null; startGhost(drag.i);
  }
  if (drag && drag.moved && ghost) { ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px'; }
});
var tapStamp = 0;
document.addEventListener('pointerup', function (e) {
  if (!drag) return; var d = drag; drag = null; tapStamp = Date.now();
  if (d.moved) {
    endGhost();
    var el = document.elementFromPoint(e.clientX, e.clientY), pot = el && el.closest && el.closest('.pot');
    if (pot && pot.getAttribute('data-id') === S.active) applyTool(d.i);
    else { S.adv = fmt(T().advDrop, { n: nameOf(person(S.active)) }); Snd.sfx('pop'); renderConsole(); }
  } else tapTool(d.i, false);
});
document.addEventListener('pointercancel', function () { drag = null; endGhost(); });

document.addEventListener('click', function (e) {
  if (e.detail > 0 && tapStamp && Date.now() - tapStamp < 300) { tapStamp = 0; return; }
  var tl = e.target.closest('.tool');
  if (tl) { if (e.detail === 0) tapTool(+tl.getAttribute('data-i'), true); return; }
  var b = e.target.closest('[data-act]'); if (!b) return;
  var a = b.getAttribute('data-act');
  switch (a) {
    case 'start': doStart(); break;
    case 'about': openDlg('about'); break;
    case 'labgo': S.round = 1; Snd.sfx('round'); beginRound(); break;
    case 'labskip': S.round = 1; Snd.sfx('pop'); beginRound(); break;
    case 'labset': var v = LABSET[+b.getAttribute('data-s')]; S.lab.sk = v[0]; S.lab.mo = v[1]; Snd.sfx('pop'); updateLab(false); break;
    case 'labfx': var st = stageOf(S.lab.sk, S.lab.mo); if (st) { playFx('labpot', STYLES[st - 1].fx); toolSound(st - 1); } break;
    case 'go': S.ov = null; Snd.sfx('pop'); renderOv(); renderConsole(); renderBubble(); { var f = $('.clue[data-act="clue"],.tool'); if (f && !S.res[S.active].attempts.length) { /* keep focus natural */ } } break;
    case 'pot': selectPerson(b.getAttribute('data-id')); break;
    case 'clue': openClue(+b.getAttribute('data-i')); break;
    case 'use': if (S.sel !== null) applyTool(S.sel); break;
    case 'next': goNext(); break;
    case 'nextRound':
      if (S.round < 3) { S.round++; S.active = null; S.ov = 'intro'; Snd.sfx('round'); render(false); }
      else { S.view = 'final'; S.ov = null; render(true); }
      break;
    case 'copy': copyPlan(); break;
    case 'replay': clearInterval(finalTimer); S = freshState({ lang: S.lang }); render(true); break;
    case 'guideOpen': openDlg('guide'); break;
    case 'closeDlg': $('#dlg').close(); break;
    case 'dprev': S.slide--; renderDeck(); { var f1 = $('#dlg .dkfoot .btn:not([disabled])'); if (f1) f1.focus(); } break;
    case 'dnext': S.slide++; renderDeck(); { var f2 = $('#dlg .dkfoot .btn:not([disabled]):last-child'); if (f2) f2.focus(); } break;
    case 'dgo': S.slide = +b.getAttribute('data-i'); renderDeck(); { var f3 = $('#dlg .pgs [aria-current="true"]'); if (f3) f3.focus(); } break;
  }
});
document.addEventListener('keydown', function (e) {
  var d = $('#dlg');
  if (d.open && S.dlg === 'about' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    var fwd = (e.key === 'ArrowRight') === (S.lang !== 'ar'); var n = slides().length;
    if (fwd && S.slide < n - 1) { S.slide++; renderDeck(); } else if (!fwd && S.slide > 0) { S.slide--; renderDeck(); }
    var f = $('#dlg .pgs [aria-current="true"]'); if (f) f.focus(); e.preventDefault(); return;
  }
  var r = e.target.closest && e.target.closest('.seg button');
  if (r && (e.key === 'ArrowRight' || e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    var key = r.getAttribute('data-dial'), v = +r.getAttribute('data-v');
    var step = (e.key === 'ArrowRight' || e.key === 'ArrowDown') ? 1 : -1; if (S.lang === 'ar' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) step = -step;
    var nv = Math.max(1, Math.min(3, v + step)); S.lab[key] = nv; updateLab(false);
    var nb = $('.seg button[data-dial="' + key + '"][data-v="' + nv + '"]'); if (nb) nb.focus(); e.preventDefault(); return;
  }
  var sg = e.target.closest && e.target.closest('.seg button');
  if (sg && (e.key === 'Enter' || e.key === ' ')) { /* native click handles */ }
});
document.addEventListener('click', function (e) {
  var sg = e.target.closest('.seg button'); if (!sg) return;
  S.lab[sg.getAttribute('data-dial')] = +sg.getAttribute('data-v'); Snd.sfx('pop'); updateLab(false);
  var nb = $('.seg button[aria-checked="true"][data-dial="' + sg.getAttribute('data-dial') + '"]'); if (nb && e.detail === 0) nb.focus();
});
$('#bSound').addEventListener('click', function () { Snd.init(); Snd.setOn(!Snd.on); store('tg.snd', Snd.on ? '1' : '0'); renderHud(); if (Snd.on) Snd.sfx('pop'); });
$('#bTheme').addEventListener('click', function () { var next = isDark() ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', next); store('tg.theme', next); renderHud(); });
$('#bLang').addEventListener('click', function () {
  S.lang = S.lang === 'en' ? 'ar' : 'en'; store('tg.lang', S.lang);
  var open = $('#dlg').open, mode = S.dlg; render(false); if (open) { if (mode === 'about') renderDeck(); else renderGuideDlg(); }
});
$('#bGuide').addEventListener('click', function () { openDlg('guide'); });
$('#bAbout').addEventListener('click', function () { openDlg('about'); });
$('#dlg').addEventListener('click', function (e) { if (e.target === e.currentTarget) e.currentTarget.close(); });
window.addEventListener('resize', function () { positionBubble(); });
document.addEventListener('visibilitychange', function () { if (!document.hidden && Snd.ctx) Snd.resume(); });

/* =====================================================
   Init
   ===================================================== */
var sv = store('tg.theme'); if (sv === 'dark' || sv === 'light') document.documentElement.setAttribute('data-theme', sv);
if (store('tg.snd') === '0') Snd.on = false;
S = freshState(); FX.init(); render(false);
})();
</script>
</body>
</html>
