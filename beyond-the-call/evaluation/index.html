<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beyond the Call — Evaluation Suite</title>
<style>
:root{
  /* Beyond the Call brand palette */
  --teal:#164E52; --teal2:#0F3A3D; --deep:#0A2325;
  --coral:#E9826A; --coral2:#FF9D7E; --ink:#A8452F;
  --apricot:#F3D2BD; --sage:#B8C9BD;
  --ivory:#FAF8F3; --ch:#17211F; --mut:#AEBDB9;
  --glass:rgba(250,248,243,.08); --glassline:rgba(184,201,189,.28);
  --gold:#F3D2BD; --gold2:#E9826A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:'Manrope',-apple-system,'Segoe UI',sans-serif;
  color:var(--ivory);
  background:var(--deep);
  min-height:100vh; overflow-x:hidden;
  padding-top:env(safe-area-inset-top,0); padding-bottom:env(safe-area-inset-bottom,0);
}
h1,h2,h3{margin:0; font-weight:800; letter-spacing:-.01em}
p{margin:0}
button{font-family:inherit}
::selection{background:var(--coral); color:#1a0e09}

/* ---------------- aurora background ---------------- */
.aurora{position:fixed; inset:0; z-index:0; overflow:hidden; background:var(--deep)}
.blob{position:absolute; border-radius:50%; filter:blur(70px); opacity:.55; will-change:transform}
.b1{width:640px;height:640px; background:radial-gradient(circle,var(--teal2),transparent 70%); top:-220px; left:-160px; animation:drift1 26s ease-in-out infinite}
.b2{width:560px;height:560px; background:radial-gradient(circle,var(--coral),transparent 70%); bottom:-240px; right:-140px; opacity:.38; animation:drift2 32s ease-in-out infinite}
.b3{width:420px;height:420px; background:radial-gradient(circle,var(--sage),transparent 70%); top:40%; right:10%; opacity:.28; animation:drift3 22s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,40px) scale(1.08)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-50px,-30px) scale(1.1)}}
@keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,50px)}}
.grain{position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

/* ---------------- layout ---------------- */
.stage{position:relative; z-index:2; width:100%; max-width:860px; margin:0 auto; padding:28px 18px 60px; min-height:100vh; display:flex; flex-direction:column; align-items:center}
.brandrow{display:flex; align-items:center; gap:9px; color:var(--apricot); font-weight:800; font-size:13.5px; letter-spacing:.03em; margin-bottom:18px; align-self:flex-start}
.brandrow .dot{width:7px;height:7px;border-radius:50%;background:var(--coral); box-shadow:0 0 10px 2px var(--coral)}

/* ---------------- mascot ---------------- */
.mascotzone{display:flex; justify-content:center; margin-bottom:6px; height:108px}
.mascot{width:92px;height:92px; animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
.mascot .blink{animation:blink 4.5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}94%,97%{transform:scaleY(.08)}}
.mascot.celebrate{animation:celebrate .7s ease-in-out 2}
@keyframes celebrate{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-22px) rotate(-10deg)}75%{transform:translateY(-22px) rotate(10deg)}}
.confetti-piece{position:absolute; top:-10px; border-radius:2px; animation:fall linear forwards}
@keyframes fall{to{transform:translateY(420px) rotate(360deg); opacity:0}}

/* ---------------- glass sheet ---------------- */
.sheet{
  position:relative; width:100%; max-width:600px;
  background:var(--glass); backdrop-filter:blur(22px) saturate(160%); -webkit-backdrop-filter:blur(22px) saturate(160%);
  border:1px solid var(--glassline); border-radius:26px;
  box-shadow:0 30px 80px -24px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.18);
  padding:36px 34px 32px; display:flex; flex-direction:column; min-height:300px;
  animation:sheetIn .5s cubic-bezier(.2,.8,.2,1);
}
@keyframes sheetIn{from{opacity:0; transform:translateY(16px) scale(.98)} to{opacity:1; transform:translateY(0) scale(1)}}
.sheet-wide{max-width:760px}

h2.title{font-size:23px; color:var(--ivory)}
.subtext{font-size:14.5px; line-height:22px; color:#C9D6D2; margin-top:9px; max-width:480px}
.kicker{font-size:11.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--coral2)}

/* ---------------- tiles (home) ---------------- */
.tiles{display:flex; flex-direction:column; gap:10px; margin-top:22px}
.tile{
  position:relative; display:flex; align-items:center; gap:16px;
  background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12); border-radius:16px;
  padding:16px 18px; cursor:pointer; text-align:left; width:100%; overflow:hidden;
  transition:transform .18s, border-color .18s, background .18s;
}
.tile::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(240,130,95,.18),transparent 55%);opacity:0;transition:opacity .25s}
.tile:hover{transform:translateY(-2px); border-color:rgba(240,130,95,.5); background:rgba(255,255,255,.08)}
.tile:hover::before{opacity:1}
.tile.soon{cursor:default; opacity:.5}
.tile.soon:hover{transform:none; border-color:rgba(255,255,255,.12)}
.tile-ic{position:relative; width:46px;height:46px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--coral),var(--ink)); box-shadow:0 6px 16px -4px rgba(240,130,95,.5)}
.tile.t2 .tile-ic{background:linear-gradient(135deg,var(--sage),#0C3335)}
.tile.t3 .tile-ic{background:linear-gradient(135deg,var(--gold),#A8452F)}
.tile.t4 .tile-ic{background:linear-gradient(135deg,#B8C9BD,#0C3335)}
.tile.t5 .tile-ic{background:linear-gradient(135deg,#2DD4A7,#0E8F63)}
.tile.soon .tile-ic{background:rgba(255,255,255,.1); box-shadow:none}
.tile-ic svg{width:22px;height:22px; color:#1a0e09}
.tile.soon .tile-ic svg{color:#8FA39E}
.tile-body{position:relative}
.tile-body h3{font-size:15.5px; color:var(--ivory)}
.tile-body p{font-size:12.5px; color:#AEBDB9; margin-top:2px}
.tile-tag{position:relative; margin-left:auto; font-size:10.5px; font-weight:800; color:#AEBDB9; white-space:nowrap; letter-spacing:.04em}

.hub-foot{margin-top:18px; text-align:center}
.linklike{background:none;border:none;color:#AEBDB9;font-size:12.5px;font-weight:700;text-decoration:underline;cursor:pointer;padding:6px}

/* ---------------- progress ring ---------------- */
.pathwrap{margin-bottom:24px}
.pathtop{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px}
.pathcount{font-size:12px; font-weight:800; color:var(--gold)}
.pathtrack{position:relative; height:30px; margin:0 14px}
.pathline{position:absolute; top:50%; left:0; right:0; height:4px; margin-top:-2px; background:rgba(255,255,255,.14); border-radius:3px; overflow:visible}
.pathfill{position:absolute; top:0; left:0; height:100%; background:linear-gradient(90deg,var(--sage),var(--coral)); border-radius:3px; transition:width .5s cubic-bezier(.2,.8,.2,1); box-shadow:0 0 10px rgba(55,201,239,.6)}
.pathdot{position:absolute; top:50%; width:9px; height:9px; margin:-4.5px 0 0 -4.5px; border-radius:50%; background:rgba(255,255,255,.22); transition:background .3s, transform .3s}
.pathdot.done{background:var(--gold); box-shadow:0 0 6px rgba(255,210,90,.7)}
.walker{position:absolute; top:50%; width:26px; height:26px; margin:-21px 0 0 -13px; transition:left .5s cubic-bezier(.2,.8,.2,1); animation:walkerbob 1.1s ease-in-out infinite}
.walker svg{width:100%;height:100%}
@keyframes walkerbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* ---------------- form fields ---------------- */
.field{margin-bottom:15px}
.field label{display:block; font-size:12px; font-weight:700; color:#AEBDB9; margin-bottom:6px}
.field .req{color:var(--coral2)}
.field input,.field select,.field textarea{
  width:100%; padding:13px 15px; border:1.5px solid rgba(255,255,255,.18); border-radius:12px;
  font-size:15px; font-family:inherit; background:rgba(255,255,255,.06); color:var(--ivory);
}
.field select{color-scheme:dark; cursor:pointer}
.field select option{background:#1C3E41; color:var(--ivory)}
.field textarea{resize:vertical; min-height:64px; line-height:1.5}
.field input::placeholder,.field textarea::placeholder{color:#8FA39E}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--coral); outline-offset:1px; border-color:var(--coral)}
.field.err input{border-color:var(--coral2); box-shadow:0 0 0 3px rgba(240,130,95,.18)}
.errmsg{font-size:12px; color:var(--coral2); margin-top:5px; font-weight:700}

/* ---------------- options ---------------- */
.qtext{font-size:20px; line-height:28px; font-weight:700; color:var(--ivory); margin-bottom:22px; min-height:60px}
.opts{display:flex; flex-direction:column; gap:10px}
.optbtn{
  display:flex; align-items:center; gap:14px; text-align:left; padding:15px 17px;
  border:1.5px solid rgba(255,255,255,.16); border-radius:13px; background:rgba(255,255,255,.05);
  cursor:pointer; font-size:14.5px; font-weight:600; color:var(--ivory);
  transition:border-color .15s, background .15s, transform .1s;
}
.optbtn:hover{border-color:rgba(240,130,95,.55); background:rgba(255,255,255,.08)}
.optbtn .badge{
  flex:none; width:25px; height:25px; border-radius:50%; border:1.5px solid rgba(255,255,255,.25);
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:#AEBDB9;
  transition:all .15s;
}
.optbtn.sel{border-color:var(--coral); background:rgba(240,130,95,.16); animation:pop .28s ease}
.optbtn.sel .badge{background:var(--coral); border-color:var(--coral); color:#1a0e09}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}

.likert{display:flex; gap:7px; margin-top:4px; flex-wrap:wrap}
.lk{
  flex:1; min-width:70px; padding:15px 5px 12px; border:1.5px solid rgba(255,255,255,.16); border-radius:12px; background:rgba(255,255,255,.05);
  cursor:pointer; text-align:center; transition:all .15s; color:var(--ivory);
}
.lk:hover{border-color:rgba(240,130,95,.5)}
.lk b{display:block; font-size:18px; font-weight:800}
.lk span{display:block; font-size:10px; margin-top:4px; color:#AEBDB9; font-weight:700; line-height:12.5px}
.lk.sel{border-color:var(--coral); background:rgba(240,130,95,.2); transform:scale(1.05); animation:pop .28s ease}

.radiorow{display:flex; gap:10px}
.radiocard{flex:1; padding:14px; border:1.5px solid rgba(255,255,255,.16); border-radius:12px; cursor:pointer; text-align:center; font-weight:700; font-size:13.5px; color:#AEBDB9; transition:all .15s}
.radiocard.sel{border-color:var(--coral); background:rgba(240,130,95,.18); color:var(--apricot)}

.navrow{display:flex; justify-content:flex-end; gap:10px; margin-top:26px}
.btn{padding:13px 24px; border-radius:11px; border:none; font-size:14px; font-weight:800; cursor:pointer; transition:transform .12s, box-shadow .18s; color:#1a0e09}
.btn:active{transform:scale(.96)}
.btn[disabled]{opacity:.35; cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--coral2),var(--ink)); box-shadow:0 10px 24px -8px rgba(240,130,95,.6)}
.btn-primary:hover:not([disabled]){box-shadow:0 12px 28px -6px rgba(240,130,95,.8)}
.btn-ghost{background:rgba(255,255,255,.08); color:var(--ivory); border:1.5px solid rgba(255,255,255,.2)}
.backbtn{background:none;border:none;color:#AEBDB9;font-size:12.5px;font-weight:700;cursor:pointer;padding:6px 2px;align-self:flex-start;margin-bottom:6px}

/* ---------------- results ---------------- */
.bignum{display:flex; align-items:baseline; gap:10px; margin:6px 0 22px}
.bignum b{font-size:54px; background:linear-gradient(135deg,var(--apricot),var(--coral2)); -webkit-background-clip:text; background-clip:text; color:transparent; line-height:1}
.bignum span{font-size:14px; color:#AEBDB9; font-weight:700}
.barlist{display:flex; flex-direction:column; gap:13px}
.baritem{display:grid; grid-template-columns:1fr 110px 38px; align-items:center; gap:12px}
.baritem .lbl{font-size:13px; font-weight:600; color:#C9D6D2; line-height:17px}
.bartrack{height:8px; background:rgba(255,255,255,.12); border-radius:5px; overflow:hidden}
.barfill{height:100%; border-radius:5px; transition:width 1s cubic-bezier(.2,.8,.2,1)}
.barval{font-size:12.5px; font-weight:800; color:var(--apricot); text-align:right}

.kresult-item{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid rgba(255,255,255,.12)}
.kresult-item:last-child{border-bottom:none}
.kicon{flex:none; width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; color:#fff}
.kicon.ok{background:#17A672}
.kicon.no{background:#E24444}
.kbody .tag{font-size:10.5px; font-weight:800; color:#8FA39E; text-transform:uppercase; letter-spacing:.03em}
.kbody .qt{font-size:13.5px; font-weight:700; margin-top:2px; color:var(--ivory)}
.kbody .ans{font-size:12.5px; color:#AEBDB9; margin-top:3px}

.comparebox{margin-top:24px; padding:18px; border:1.5px solid rgba(255,255,255,.16); border-radius:14px; display:flex; align-items:center; gap:22px; background:rgba(255,255,255,.04)}
.comparebox .cmpnum{text-align:center}
.comparebox .cmpnum b{font-size:28px; color:var(--ivory); display:block}
.comparebox .cmpnum span{font-size:11px; color:#AEBDB9; font-weight:700}
.cmparrow{font-size:18px; color:var(--sage)}
.cmpdelta{margin-left:auto; text-align:right}
.cmpdelta b{font-size:21px; color:var(--coral2)}
.cmpdelta span{display:block; font-size:11px; color:#AEBDB9; font-weight:700}

.ovtable{width:100%; border-collapse:collapse; font-size:13px}
.ovtable th{text-align:left; font-size:10.5px; letter-spacing:.03em; color:#8FA39E; padding:8px 10px; border-bottom:1.5px solid rgba(255,255,255,.25)}
.ovtable td{padding:9px 10px; border-bottom:1px solid rgba(255,255,255,.1); color:var(--ivory)}
.emptynote{padding:26px 10px; text-align:center; color:#AEBDB9; font-size:13.5px; font-weight:600}

.toast{
  position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(14px); opacity:0;
  background:linear-gradient(135deg,var(--teal2),var(--teal)); color:#fff; padding:12px 20px; border-radius:12px; font-size:13px; font-weight:700;
  border:1px solid rgba(255,255,255,.18);
  transition:all .3s; pointer-events:none; z-index:60; box-shadow:0 14px 30px rgba(0,0,0,.4);
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

/* ---------------- scenario specific ---------------- */
.bridgewrap{position:relative; height:140px; margin:4px -6px 22px; border-radius:16px; overflow:hidden;
  background:linear-gradient(180deg,#164E52 0%,#0F3A3D 55%,#1a0e09 100%)}
.bridgesky{position:absolute; inset:0}
.cloudshape{position:absolute; background:rgba(255,255,255,.07); border-radius:50px; animation:clouddrift 18s linear infinite}
.bridgewater{position:absolute; left:0; right:0; bottom:0; height:46px; background:
  repeating-linear-gradient(90deg, rgba(55,201,239,.18) 0 24px, transparent 24px 48px);
  animation:wavescroll 3.5s linear infinite}
.bridgewater::before{content:"";position:absolute; inset:0; background:linear-gradient(180deg,rgba(5,25,56,0) 0%,rgba(5,25,56,.9) 100%)}
@keyframes wavescroll{from{background-position-x:0}to{background-position-x:48px}}
@keyframes clouddrift{from{transform:translateX(-40px)}to{transform:translateX(900px)}}
.bridgenodes{position:absolute; left:34px; right:34px; top:58%; height:4px}
.bridgepath{position:absolute; top:0; left:0; right:0; height:4px; background:rgba(255,255,255,.18); border-radius:3px}
.bridgefill{position:absolute; top:0; left:0; height:4px; background:linear-gradient(90deg,var(--gold),var(--coral)); border-radius:3px; transition:width .6s cubic-bezier(.2,.8,.2,1); box-shadow:0 0 12px rgba(55,201,239,.7)}
.bstart,.bgoal{position:absolute; top:50%; transform:translate(-50%,-50%); width:30px; height:30px}
.bstart{left:0}.bgoal{right:0; transform:translate(50%,-50%)}
.bnode{position:absolute; top:50%; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%; background:rgba(255,255,255,.25); border:2px solid rgba(255,255,255,.35); transition:all .3s}
.bnode.done{background:var(--gold); border-color:var(--gold); box-shadow:0 0 10px rgba(255,210,90,.8)}
.bwalker{position:absolute; top:50%; width:34px; height:34px; margin:-30px 0 0 -17px; transition:left .6s cubic-bezier(.2,.8,.2,1); animation:walkerbob 1.1s ease-in-out infinite; filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.bwalker svg{width:100%;height:100%}
.sparkle{position:absolute; animation:sparkle 1.8s ease-in-out infinite; pointer-events:none}
@keyframes sparkle{0%,100%{opacity:.25; transform:scale(.8) rotate(0deg)}50%{opacity:1; transform:scale(1.15) rotate(20deg)}}

.scenpick{display:flex; flex-direction:column; gap:12px; margin-top:18px}
.scencard{position:relative; border:1.5px solid rgba(255,255,255,.14); border-radius:16px; padding:18px 20px; cursor:pointer; background:rgba(255,255,255,.05); transition:all .18s; overflow:hidden}
.scencard:hover{border-color:rgba(240,130,95,.5); transform:translateY(-2px)}
.scencard h3{font-size:16px; color:var(--apricot)}
.scencard p{font-size:12.5px; color:#AEBDB9; margin-top:4px}
.scentag{display:inline-block; margin-top:8px; font-size:10.5px; font-weight:800; color:var(--coral2); letter-spacing:.03em}

.meterpanel{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:22px; padding:14px; background:rgba(0,0,0,.18); border-radius:14px; border:1px solid rgba(255,255,255,.1)}
.meter{text-align:center}
.meter .mtrack{height:56px; width:9px; background:rgba(255,255,255,.12); border-radius:5px; margin:0 auto 7px; position:relative; overflow:hidden}
.meter .mfill{position:absolute; bottom:0; left:0; right:0; border-radius:5px; transition:height .7s cubic-bezier(.2,.8,.2,1)}
.meter .mlbl{font-size:8.5px; font-weight:800; color:#AEBDB9; line-height:10px; text-transform:uppercase; letter-spacing:.02em}

.callbubble{background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14); border-radius:16px 16px 16px 4px; padding:16px 18px; margin-bottom:18px; position:relative}
.callbubble .who{font-size:10.5px; font-weight:800; color:var(--sage); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px}
.callbubble p{font-size:15px; line-height:23px; color:var(--ivory)}
.typecursor{display:inline-block; width:2px; height:16px; background:var(--coral2); margin-left:2px; animation:caret .8s steps(1) infinite; vertical-align:middle}
@keyframes caret{50%{opacity:0}}

.reflectbox{margin-top:16px; padding:16px 18px; border-radius:14px; border:1.5px solid rgba(240,130,95,.4); background:rgba(240,130,95,.1); animation:sheetIn .35s ease}
.reflectbox .rk{font-size:10.5px; font-weight:800; color:var(--coral2); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px}
.reflectbox p{font-size:13.5px; line-height:20px; color:var(--ivory)}

.radarwrap{display:flex; justify-content:center; margin:18px 0}

/* checkpoint list */
.mgrnote{display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:12px; background:rgba(255,210,90,.1); border:1px solid rgba(255,210,90,.3); margin-bottom:18px; font-size:12.5px; line-height:18px; color:#FAF8F3}
.field2col{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.kpirow{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:18px 0}
.kpitile{background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.14); border-radius:14px; padding:14px 16px}
.kpilbl{font-size:10.5px; font-weight:800; color:#AEBDB9; text-transform:uppercase; letter-spacing:.03em}
.kpival{font-size:26px; font-weight:800; color:var(--ivory); margin:4px 0 5px}
.kpitrend{font-size:11px; font-weight:800}
.kpitrend.good{color:#2DD4A7}
.kpitrend.bad{color:#FF6B6B}
.kpitrend.neutral{color:#AEBDB9}
.kpispark{margin-top:8px; opacity:.9}
.samplebadge{display:inline-block; margin-bottom:12px; padding:5px 14px; border-radius:20px; background:rgba(243,210,189,.16); border:1px solid rgba(243,210,189,.4); color:var(--apricot); font-size:11px; font-weight:800; letter-spacing:.04em}
.journeywrap{margin:20px 0 22px; padding:16px 18px; border-radius:16px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1)}
.journeytop{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px}
.journeytrack{position:relative; height:28px; margin:0 10px}
.journeyline{position:absolute; top:50%; left:0; right:0; height:4px; margin-top:-2px; background:rgba(255,255,255,.14); border-radius:3px}
.journeyfill{position:absolute; top:50%; left:0; height:4px; margin-top:-2px; background:linear-gradient(90deg,var(--sage),var(--coral)); border-radius:3px; transition:width .6s cubic-bezier(.2,.8,.2,1)}
.jnode{position:absolute; top:50%; width:20px; height:20px; margin:-10px 0 0 -10px; border-radius:50%; background:var(--ivory); border:2px solid rgba(255,255,255,.3); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:var(--teal); transition:all .3s}
.jnode.done{border-color:var(--coral); background:var(--apricot); box-shadow:0 0 8px rgba(233,130,106,.5)}
.journeywrap .walker{position:absolute; top:50%}
.journeylabels{display:flex; justify-content:space-between; margin-top:6px; padding:0 2px}
.journeylabels span{font-size:10px; font-weight:700; color:#8FA39E; flex:1; text-align:center}

.behlist{display:flex; flex-direction:column; gap:8px; margin-top:14px; max-height:360px; overflow-y:auto; padding-right:4px}
.behcard{display:flex; gap:12px; align-items:flex-start; padding:13px 15px; border:1.5px solid rgba(255,255,255,.14); border-radius:12px; background:rgba(255,255,255,.04); cursor:pointer; transition:all .15s}
.behcard:hover{border-color:rgba(55,201,239,.4)}
.behcard.sel{border-color:var(--coral); background:rgba(55,201,239,.1)}
.behcheck{flex:none; width:20px;height:20px; border-radius:6px; border:1.5px solid rgba(255,255,255,.3); display:flex; align-items:center; justify-content:center; font-size:13px; color:#1a0e09; font-weight:800; margin-top:1px}
.behcard.sel .behcheck{background:var(--coral); border-color:var(--coral)}
.behtxt{font-size:13.5px; font-weight:700; line-height:19px; color:var(--ivory)}
.behsrc{font-size:10.5px; font-weight:800; color:var(--gold); text-transform:uppercase; letter-spacing:.03em; margin-top:2px}
.behfocus{margin-top:4px}
.statusrow{display:flex; gap:9px; margin-top:12px; flex-wrap:wrap}
.statusbtn{flex:1; min-width:140px; padding:13px 10px; border-radius:11px; border:1.5px solid rgba(255,255,255,.18); background:rgba(255,255,255,.05); color:var(--ivory); font-size:13.5px; font-weight:700; cursor:pointer; transition:all .15s}
.statusbtn:hover{border-color:rgba(55,201,239,.5)}
.statusbtn.sel{border-color:var(--coral); background:rgba(55,201,239,.18)}
.revlist{display:flex; flex-direction:column; gap:1px; margin-top:14px; background:rgba(255,255,255,.1); border-radius:12px; overflow:hidden}
.revrow{background:rgba(255,255,255,.04); padding:13px 16px}
.revtxt b{display:block; font-size:13.5px; color:var(--ivory)}
.revtxt span{font-size:12px; color:var(--gold); font-weight:700}
.statuschip{display:inline-block; margin-top:16px; padding:7px 16px; border-radius:20px; background:rgba(255,210,90,.15); border:1px solid rgba(255,210,90,.4); color:var(--gold); font-size:12.5px; font-weight:800}
.cplist{display:flex; flex-direction:column; gap:10px; margin-top:16px}
.cprow{display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border:1px solid rgba(255,255,255,.14); border-radius:12px; background:rgba(255,255,255,.04)}
.cprow b{font-size:13.5px}
.cprow span{font-size:12px; color:#AEBDB9}

@media (max-width:700px){ .trackergrid{grid-template-columns:1fr !important} }
@media (max-width:560px){
  .sheet{padding:26px 20px 24px; border-radius:20px}

  .baritem{grid-template-columns:1fr 70px 30px; gap:7px}

}

<script>
(function(){
"use strict";

/* ================= SOUND ================= */
const SND = { on: (localStorage.getItem("btc_eval_sound")!=="off") };
function ac(){ if(!window.__ac){ try{ window.__ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ window.__ac=null; } } return window.__ac; }
function tone(freq, start, dur, type, vol, glideTo){
  if(!SND.on) return; const c=ac(); if(!c) return;
  const t=c.currentTime+start;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(freq,t);
  if(glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.14,t+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.02);
}
function sndStep(){ tone(620,0,.09,"sine",.12,760); }
function sndSelect(){ tone(520,0,.07,"triangle",.13); tone(780,.05,.09,"triangle",.1); }
function sndSuccess(){ [0,523.25,659.25,783.99,1046.5].slice(1).forEach((f,i)=>tone(f,i*.08,.18,"sine",.13)); }
function sndWhoosh(){ tone(200,0,.22,"sine",.08,440); }
function sndOops(){ tone(260,0,.16,"sawtooth",.08,180); }
function updateSndBtn(){
  const b=document.getElementById("sndtoggle"); if(!b) return;
  b.innerHTML = SND.on
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="#FAF8F3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 010 7"/><path d="M19 6a9 9 0 010 12"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="#AEBDB9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
}

/* ================= MASCOT ================= */
function mascotSVG(mood){
  mood = mood||"idle";
  const mouths = {
    idle:'<path d="M41 57q7 6 14 0" stroke="#1a0e09" stroke-width="2.4" fill="none" stroke-linecap="round"/>',

    oops:'<path d="M40 60q8 -7 16 0" stroke="#1a0e09" stroke-width="2.4" fill="none" stroke-linecap="round"/>',
    celebrate:'<path d="M36 54q12 13 24 0" stroke="#1a0e09" stroke-width="2.8" fill="none" stroke-linecap="round"/>'
  };
  return `<svg viewBox="0 0 96 100" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="48" cy="90" rx="22" ry="5" fill="#000" opacity=".18"/>
    <path d="M14 52c0-24 15-40 34-40s34 16 34 40-14 34-34 34-34-10-34-34z" fill="url(#bodyGrad)"/>
    <defs><linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E7A74"/><stop offset="100%" stop-color="#164E52"/>
    </linearGradient></defs>
    <path d="M16 46c0-20 14-36 32-36" stroke="#E9826A" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M80 46c0-20-14-36-32-36" stroke="#E9826A" stroke-width="7" fill="none" stroke-linecap="round"/>
    <circle cx="16" cy="50" r="7" fill="#E9826A"/><circle cx="80" cy="50" r="7" fill="#E9826A"/>
    <rect x="42" y="4" width="10" height="7" rx="3" fill="#F3D2BD"/>
    <g class="blink"><ellipse cx="36" cy="46" rx="5.5" ry="7" fill="#FAF8F3"/><ellipse cx="60" cy="46" rx="5.5" ry="7" fill="#FAF8F3"/>
      <circle cx="37" cy="48" r="3" fill="#164E52"/><circle cx="61" cy="48" r="3" fill="#164E52"/></g>
    ${mouths[mood]||mouths.idle}
  </svg>`;
}
function setMascot(mood, bump){
  const z=document.getElementById("mascotzone");
  z.innerHTML = `<div class="mascot${bump?" celebrate":""}">${mascotSVG(mood)}</div>`;
  if(bump){ burstConfetti(z); sndSuccess(); }
}
function burstConfetti(container){
  const colors=["#E9826A","#F3D2BD","#FF9D7E","#B8C9BD","#FFFFFF"];
  for(let i=0;i<22;i++){
    const d=document.createElement("div");
    d.className="confetti-piece";
    const size=4+Math.random()*5;
    d.style.width=size+"px"; d.style.height=(size*1.6)+"px";
    d.style.left=(40+Math.random()*20)+"%";
    d.style.background=colors[i%colors.length];
    d.style.animationDuration=(0.8+Math.random()*0.7)+"s";
    d.style.transform=`rotate(${Math.random()*360}deg)`;
    container.appendChild(d);
    setTimeout(()=>d.remove(),1700);
  }
}

function showToast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(window.__tt); window.__tt=setTimeout(()=>t.classList.remove("show"),2600);
}
function walkerGlyph(){
  return `<svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="12" fill="url(#dialGrad)"/>
    <circle cx="9.3" cy="11.5" r="1.6" fill="#1a0e09"/><circle cx="16.7" cy="11.5" r="1.6" fill="#1a0e09"/>
    <path d="M9 16.5q4 3 8 0" stroke="#1a0e09" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>`;
}
function dial(curr,total,label){
  const pct = (curr-1)/(total-1)*100;
  const dots = Array.from({length:total}).map((_,i)=>{
    const p = i/(total-1)*100;
    return `<div class="pathdot${i<=curr-1?" done":""}" style="left:${p}%"></div>`;
  }).join("");
  return `<div class="pathwrap"><div class="pathtop"><span class="kicker">${label||""}</span><span class="pathcount">${curr} / ${total}</span></div>
  <div class="pathtrack"><div class="pathline"><div class="pathfill" style="width:${pct}%"></div></div>
  ${dots}<div class="walker" style="left:${pct}%">${walkerGlyph()}</div></div></div>`;
}
function countUp(el, target, suffix){
  let cur=0; const dur=750, t0=performance.now();
  function step(t){
    const p=Math.min(1,(t-t0)/dur); cur=Math.round(target*(1-Math.pow(1-p,3)));
    el.textContent = cur + (suffix||"");
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ---------------- TRACKER ---------------- */
function sparkline(vals,w,h,color){
  const lo=Math.min(...vals), hi=Math.max(...vals);
  const xs=vals.map((v,i)=>i/(vals.length-1)*(w-4)+2);
  const ys=vals.map(v=>h-3-((v-lo)/((hi-lo)||1))*(h-6));
  const path=xs.map((x,i)=>`${i===0?"M":"L"}${x},${ys[i]}`).join(" ");
  const dot=`<circle cx="${xs[xs.length-1]}" cy="${ys[ys.length-1]}" r="2.6" fill="${color}"/>`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>${dot}</svg>`;
}
function kpiTileSpark(label, series, goodDir, suffix){
  suffix=suffix||"";
  const base=series[0], latest=series[series.length-1];
  const d = latest-base; const good = goodDir==="up"? d>=0 : d<=0;
  const arrow = d===0?"\u2014":(d>0?"\u25B2":"\u25BC");
  const color = good? "#17A672" : "#E24444";
  const spark = sparkline(series, 92, 26, color);

function svgLine(points, w, h, color){
  if(points.length<2) return `<div style="font-size:12.5px;color:#AEBDB9">Add at least two points (baseline + one check-in) to see a trend line.</div>`;
  const xs = points.map((p,i)=>i/(points.length-1)*(w-30)+15);
  const vals = points.map(p=>p.v);
  const lo = Math.min(...vals,0), hi = Math.max(...vals,100);
  const ys = vals.map(v=> h-14 - ((v-lo)/(hi-lo||1))*(h-28));
  const path = xs.map((x,i)=>`${i===0?"M":"L"}${x},${ys[i]}`).join(" ");
  const dots = xs.map((x,i)=>`<circle cx="${x}" cy="${ys[i]}" r="4" fill="${color}"/>`).join("");
  const labels = points.map((p,i)=>{ const anchor = i===0?"start":(i===points.length-1?"end":"middle"); return `<text x="${xs[i]}" y="${h-1}" font-size="9" fill="#AEBDB9" text-anchor="${anchor}">${p.l}</text>`; }).join("");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}${labels}
  </svg>`;
}
function svgRadar(baseVals, latestVals, w){
  const n=SKILLS.length, cx=w/2, cy=w/2, R=w/2-46;
  function pt(i,v){ const a = -Math.PI/2 + i*2*Math.PI/n; const r = R*(v/100); return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; }
  const rings=[0.25,0.5,0.75,1].map(f=>{
    const p = SKILLS.map((s,i)=>pt(i,100*f).join(",")).join(" ");
    return `<polygon points="${p}" fill="none" stroke="rgba(255,255,255,.14)"/>`;
  }).join("");
  const axes = SKILLS.map((s,i)=>{ const [x,y]=pt(i,100); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(255,255,255,.14)"/>`; }).join("");
  const labels = SKILLS.map((s,i)=>{ const [x,y]=pt(i,122); return `<text x="${x}" y="${y}" font-size="9.5" fill="#C9D6D2" text-anchor="middle" dominant-baseline="middle">${s.l}</text>`; }).join("");
  function poly(vals,color,fillOp){
    const p = SKILLS.map((s,i)=>pt(i,vals[s.id]!=null?vals[s.id]:0).join(",")).join(" ");
    return `<polygon points="${p}" fill="${color}" fill-opacity="${fillOp}" stroke="${color}" stroke-width="2"/>`;
  }
  return `<svg width="${w}" height="${w+16}" viewBox="0 0 ${w} ${w+16}">
    ${rings}${axes}
    ${baseVals?poly(baseVals,"#B8C9BD",0.14):""}
    ${latestVals?poly(latestVals,"#E9826A",0.22):""}
    ${labels}
  </svg>`;
}
function kpiTile(label, base, latest, goodDir, suffix){
  suffix = suffix||"";
  const has = latest!=null;
  let trend = "";
  if(has && base!=null){
    const d = latest-base;
    const good = goodDir==="up" ? d>=0 : d<=0;
    const arrow = d===0 ? "&#8212;" : (d>0?"&#9650;":"&#9660;");
    trend = `<span class="kpitrend ${good?"good":"bad"}">${arrow} ${Math.abs(d).toFixed(1)}${suffix}</span>`;
  }
  return `<div class="kpitile"><div class="kpilbl">${label}</div><div class="kpival">${has?latest.toFixed(1):(base!=null?base.toFixed(1):"\u2014")}${suffix}</div>${trend || '<span class="kpitrend neutral">baseline</span>'}</div>`;
}

    const v=b.getAttribute("data-go");
    if(v==="reaction-start"){ S.qi=0; S.answers=[]; }
    if(v==="know-start"){ S.qi=0; S.answers=[]; }
    go(v);
  });

  const rBegin=document.getElementById("r-begin");
  if(rBegin) rBegin.onclick=()=>{
    const name=document.getElementById("r-name").value.trim();
    if(!name){ S.err="r-name"; render(); return; }
    S.name=name; S.role=document.getElementById("r-role").value;
    S.qi=0; S.answers=[]; clearErr();
    go("reaction-q");
  };
  document.querySelectorAll(".lk").forEach(b=>b.onclick=()=>{ sndSelect(); S.answers[S.qi]=parseInt(b.getAttribute("data-val"),10); render(); });
  const rNext=document.getElementById("r-next");
  if(rNext) rNext.onclick=()=>{
    if(S.qi<REACTION_Q.length-1){ sndStep(); S.qi++; render(); }
    else{
      const all=load(LS.reaction);
      all.push({id:uid(), name:S.name, role:S.role, date:new Date().toISOString(), answers:S.answers.slice()});
      save(LS.reaction, all); showToast("Reaction survey saved"); go("reaction-result");
    }
  };
  const rPrev=document.getElementById("r-prev"); if(rPrev) rPrev.onclick=()=>{ if(S.qi>0){ S.qi--; render(); } else { go("reaction-start"); } };

  document.querySelectorAll(".radiocard").forEach(c=>c.onclick=()=>{ S.phase=c.getAttribute("data-phase"); render(); });
  const kBegin=document.getElementById("k-begin");
  if(kBegin) kBegin.onclick=()=>{
    const name=document.getElementById("k-name").value.trim();
    if(!name){ S.err="k-name"; render(); return; }
    S.name=name; S.qi=0; S.answers=[]; clearErr();
    go("know-q");
  };
  document.querySelectorAll(".optbtn[data-val]").forEach(b=>b.onclick=()=>{ sndSelect(); S.answers[S.qi]=parseInt(b.getAttribute("data-val"),10); render(); });
  const kNext=document.getElementById("k-next");
  if(kNext) kNext.onclick=()=>{
    if(S.qi<KNOW_Q.length-1){ sndStep(); S.qi++; render(); }
    else{
      const all=load(LS.knowledge);
      all.push({id:uid(), name:S.name, phase:S.phase, date:new Date().toISOString(), answers:S.answers.slice()});
      save(LS.knowledge, all); showToast("Knowledge assessment saved"); go("know-result");
    }
  };
  const kPrev=document.getElementById("k-prev"); if(kPrev) kPrev.onclick=()=>{ if(S.qi>0){ S.qi--; render(); } else { go("know-start"); } };

  /* scenario pick */
  document.querySelectorAll(".scencard").forEach(c=>c.onclick=()=>{
    const name=document.getElementById("sc-name").value.trim();
    if(!name){ S.err="sc-name"; render(); return; }
    S.name=name; clearErr();
    S.scenKey=c.getAttribute("data-scen"); S.scenStep="s1"; S.meters=freshMeters(); S.scenDepth=0;
    S.lastReflect=null; S.awaitingNext=false; S.lastChoice=null;
    sndWhoosh();
    go("scenario-play");
  });
  /* scenario play */
  document.querySelectorAll(".optbtn[data-opt]").forEach(b=>b.onclick=()=>{
    sndSelect();
    const oi=parseInt(b.getAttribute("data-opt"),10);
    const step = SCENARIOS[S.scenKey].steps[S.scenStep];
    const choice = step.options[oi];
    Object.keys(choice.d||{}).forEach(k=>{ S.meters[k]=Math.max(0,Math.min(100,S.meters[k]+choice.d[k])); });
    S.lastReflect = choice.reflect; S.lastChoice=oi; S.awaitingNext=true; S.pendingNext=choice.next;
    render();
  });
  const scCont=document.getElementById("sc-continue");
  if(scCont) scCont.onclick=()=>{
    if(S.pendingNext==="END"){
      const all=load(LS.scenario);
      all.push({id:uid(), name:S.name, scenKey:S.scenKey, date:new Date().toISOString(), meters:Object.assign({},S.meters)});
      save(LS.scenario, all); showToast("Scenario saved");
      go("scenario-result");
    } else {
      sndStep();
      S.scenDepth=(S.scenDepth||0)+1;
      S.scenStep=S.pendingNext; S.lastReflect=null; S.awaitingNext=false;
      render();
    }
  };

  /* tracker */
  const tBegin=document.getElementById("t-begin");
  if(tBegin) tBegin.onclick=()=>{
    const name=document.getElementById("t-name").value.trim();
    if(!name){ S.err="t-name"; render(); return; }
    clearErr();
    const num=(id)=>{ const el=document.getElementById(id); return el&&el.value?parseFloat(el.value):null; };
    const setup = { name, date:document.getElementById("t-date").value, nps:num("t-nps"), churn:num("t-churn"), csat:num("t-csat"), complaints:num("t-complaints") };
    const all = load(LS.tracker);
    const rec = {id:uid(), name:setup.name, date:setup.date, baseline:{nps:setup.nps, churn:setup.churn, csat:setup.csat, complaints:setup.complaints}, baselineSkills:null, checkpoints:[]};
    all.push(rec); save(LS.tracker, all);
    S.activeTrackerId = rec.id;
    sndSuccess();
    showToast("Cohort created"); go("tracker-dash");
  };
  const newCp=document.getElementById("t-newcp");
  if(newCp) newCp.onclick=()=>{ document.getElementById("cp-form").style.display="block"; newCp.style.display="none"; };
  const cpCancel=document.getElementById("cp-cancel");
  if(cpCancel) cpCancel.onclick=()=>{ render(); };
  const cpSave=document.getElementById("cp-save");
  if(cpSave) cpSave.onclick=()=>{
    const all = load(LS.tracker);
    const rec = all.find(t=>t.id===S.activeTrackerId) || all[all.length-1];
    const skills={}; SKILLS.forEach(s=>{ const v=document.getElementById("cp-sk-"+s.id).value; skills[s.id]=v?parseFloat(v):0; });
    const cnum=(id)=>{ const el=document.getElementById(id); return el&&el.value?parseFloat(el.value):null; };
    rec.checkpoints.push({
      label: document.getElementById("cp-label").value || ("Check-in "+(rec.checkpoints.length+1)),
      date: document.getElementById("cp-date").value || new Date().toISOString(),
      nps: parseFloat(document.getElementById("cp-nps").value||0),
      churn: cnum("cp-churn"), csat: cnum("cp-csat"), complaints: cnum("cp-complaints"),
      skills
    });
    if(!rec.baselineSkills) rec.baselineSkills = Object.assign({},skills);
    save(LS.tracker, all);
    sndSuccess();
    showToast("Check-in saved"); render();
  };

  /* behavior log */
  document.querySelectorAll(".behcard").forEach(c=>c.onclick=()=>{
    sndSelect();
    const id=c.getAttribute("data-beh");
    S.behPicked = S.behPicked||[];
    const i = S.behPicked.indexOf(id);
    if(i===-1) S.behPicked.push(id); else S.behPicked.splice(i,1);
    render();
  });
  const bContinue=document.getElementById("b-continue");
  if(bContinue) bContinue.onclick=()=>{
    const name=document.getElementById("b-name").value.trim();
    if(!name){ S.err="b-name"; render(); return; }
    if(!(S.behPicked&&S.behPicked.length)){ showToast("Pick at least one behavior to continue"); return; }
    S.name=name; clearErr(); S.behIdx=0; S.behEntries=S.behEntries||{};
    sndWhoosh(); go("behavior-form");
  };
  document.querySelectorAll(".statusbtn").forEach(b=>b.onclick=()=>{
    sndSelect();
    const picked=S.behPicked||[]; const id=picked[S.behIdx||0];
    S.behEntries=S.behEntries||{}; S.behEntries[id]=Object.assign({}, S.behEntries[id], {status:b.getAttribute("data-status")});
    render();
  });
  const bCtx=document.getElementById("b-context");
  if(bCtx) bCtx.oninput=(e)=>{ const id=(S.behPicked||[])[S.behIdx||0]; S.behEntries[id].context=e.target.value; };
  const bReason=document.getElementById("b-reason");
  if(bReason) bReason.onchange=(e)=>{ const id=(S.behPicked||[])[S.behIdx||0]; S.behEntries[id].reason=e.target.value; };
  const bNote=document.getElementById("b-note");
  if(bNote) bNote.oninput=(e)=>{ const id=(S.behPicked||[])[S.behIdx||0]; S.behEntries[id].note=e.target.value; };
  const bNext=document.getElementById("b-next");
  if(bNext) bNext.onclick=()=>{
    const picked=S.behPicked||[]; const id=picked[S.behIdx||0]; const entry=S.behEntries[id]||{};
    if(entry.status==="consistent"||entry.status==="sometimes"){
      const ctx=(document.getElementById("b-context")||{}).value||"";
      entry.context=ctx;
      if(!ctx.trim()){ S.err="b-context"; render(); return; }
    } else if(entry.status==="not_yet"){
      const note=(document.getElementById("b-note")||{}).value||"";
      const reason=(document.getElementById("b-reason")||{}).value||"";
      entry.note=note; entry.reason=reason;
      if(!note.trim()){ S.err="b-note"; render(); return; }
    }
    clearErr();
    const picked2=S.behPicked||[];
    if((S.behIdx||0) < picked2.length-1){ sndStep(); S.behIdx=(S.behIdx||0)+1; render(); }
    else{ sndStep(); go("behavior-review"); }
  };
  const bPrev=document.getElementById("b-prev");
  if(bPrev) bPrev.onclick=()=>{ if((S.behIdx||0)>0){ S.behIdx--; render(); } else { go("behavior-pick"); } };
  const bBackReview=document.getElementById("b-backreview");
  if(bBackReview) bBackReview.onclick=()=>{ S.view="behavior-form"; render(); };
  const bSubmit=document.getElementById("b-submit");
  if(bSubmit) bSubmit.onclick=()=>{
    const picked=S.behPicked||[];
    const entries = picked.map(id=>Object.assign({behaviorId:id}, S.behEntries[id]));
    const all=load(LS.behavior);
    all.push({id:uid(), name:S.name, date:new Date().toISOString(), entries, status:"Pending manager review"});
    save(LS.behavior, all);
    showToast("Sent to your manager"); go("behavior-done");
  };

  const tLive=document.getElementById("t-live"); if(tLive) tLive.onclick=()=>go("tracker-start");
  const expR=document.getElementById("exp-r"); if(expR) expR.onclick=()=>exportCSV("reaction");
  const expK=document.getElementById("exp-k"); if(expK) expK.onclick=()=>exportCSV("knowledge");
  const expS=document.getElementById("exp-s"); if(expS) expS.onclick=()=>exportCSV("scenario");
  const expB=document.getElementById("exp-b"); if(expB) expB.onclick=()=>exportCSV("behavior");
}

function exportCSV(type){
  let rows, name;
  if(type==="reaction"){
    const all=load(LS.reaction);
    rows=[["Name","Role","Date",...REACTION_Q.map((q,i)=>"Q"+(i+1))].join(",")];
    all.forEach(x=>rows.push([csv(x.name),csv(x.role),x.date,...x.answers].join(",")));
    name="beyond-the-call-reaction-results.csv";
  } else if(type==="knowledge"){
    const all=load(LS.knowledge);
    rows=[["Name","Phase","Date","Score",...KNOW_Q.map((q,i)=>"Q"+(i+1))].join(",")];
    all.forEach(x=>{
      const score=x.answers.reduce((n,a,i)=>n+(a===KNOW_Q[i].c?1:0),0);
      rows.push([csv(x.name),x.phase,x.date,score,...x.answers.map(a=>String.fromCharCode(65+a))].join(","));
    });
    name="beyond-the-call-knowledge-results.csv";
  } else if(type==="scenario"){
    const all=load(LS.scenario);
    rows=[["Name","Scenario","Date",...SKILLS.map(s=>s.l)].join(",")];
    all.forEach(x=>rows.push([csv(x.name),SCENARIOS[x.scenKey].title,x.date,...SKILLS.map(s=>Math.round(x.meters[s.id]))].join(",")));
    name="beyond-the-call-scenario-results.csv";
  } else {
    const all=load(LS.behavior);
    rows=[["Name","Date","Status","Behavior","Result","Reason","Context/Note"].join(",")];
    all.forEach(x=>{
      x.entries.forEach(e=>{
        const b=BEHAVIORS.find(bb=>bb.id===e.behaviorId);
        const resLabel = e.status==="consistent"?"Yes - consistently": e.status==="sometimes"?"Yes - sometimes":"Not yet";
        rows.push([csv(x.name),x.date,csv(x.status),csv(b?b.l:e.behaviorId),csv(resLabel),csv(e.reason||""),csv(e.context||e.note||"")].join(","));
      });
    });
    name="beyond-the-call-behavior-log.csv";
  }
  const blob=new Blob([rows.join("\n")],{type:"text/csv"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  showToast("CSV downloaded");
}
function csv(s){ s=(s||"").toString(); return '"'+s.replace(/"/g,'""')+'"'; }

render();
})();
</script>
</body>
